/* five fixed gears, so the leg cycle is not rewritten on every frame */
const GAIT_STEPS = [
  {from:0,  to:16, dur:'.80s'},
  {from:16, to:24, dur:'.62s'},
  {from:24, to:34, dur:'.48s'},
  {from:34, to:50, dur:'.36s'},
  {from:50, to:1e9, dur:'.26s'}
];
function resetGait(c){
  if (!c.el) return;
  c.gaitWant = null; c.gaitFor = 0; c.vis = 0;
  if (c.gaitMode === 'none') return;                 /* already still — leave the DOM alone */
  c.gaitMode = 'none'; c.gaitSet = null; c.gaitStep = undefined;
  c.el.classList.remove('walking','running','resting','crouch');
}
function drawCat(c){
  if (!c.el) return;
  const onSpot = c.spot && (c.state==='sleep' || c.state==='lounge') && !c.jump;
  const s  = (onSpot ? c.spot.scale : depthScale(c.y)) * catScaleBase(c);
  const st = c.stretch || 1;                 /* squash & stretch on jumps   */
  const tq = c.turnSq  || 1;                 /* narrows while turning round */
  c.el.style.setProperty('--flip', c.dir);
  c.el.style.setProperty('--inv', (1/Math.max(.25, s)).toFixed(3));
  c.el.style.transform = 'translate('+c.x.toFixed(1)+'px,'+c.y.toFixed(1)+'px) translate(-50%,-100%) scale('+
    (s*c.dir*tq/st).toFixed(3)+','+(s*st).toFixed(3)+')';
  /* Depth order is sticky: two cats at the same depth would otherwise swap places every
     frame as they jostle, which reads as a flicker. */
  const z = onSpot ? c.spot.z : catZ(c.y);
  if (c.zNow === undefined || Math.abs(z - c.zNow) >= 3 || onSpot){
    c.zNow = z;
    c.el.style.zIndex = z;
  }
}

/* ---- turning ----
   The artwork is drawn facing LEFT (head at x=13, tail at x=51), so an unmirrored
   cat (dir = +1) looks left and a mirrored one (dir = -1) looks right.            */
const TURN = 0.26, FACE_L = 1, FACE_R = -1;
const dirFor = ux => ux > 0 ? FACE_R : FACE_L;

function turnTo(c, want){
  if (c.dirWant === undefined) c.dirWant = c.dir;
  if (want === c.dirWant || (c.turnT||0) > 0 || (c.turnLock||0) > 0) return;
  c.dirWant = want; c.turnT = TURN; c.turned = false; c.turnLock = 0.45;
}
/* ux is the intended direction of travel (-1..1), 0 when standing still */
function faceMotion(c, ux, dt){
  if (c.dirWant === undefined) c.dirWant = c.dir;
  c.turnLock = Math.max(0, (c.turnLock||0) - dt);
  if (Math.abs(ux) > 0.14) turnTo(c, dirFor(ux));
  if ((c.turnT||0) > 0){
    c.turnT -= dt;
    const p = clamp(1 - c.turnT/TURN, 0, 1);
    c.turnSq = 1 - 0.36*Math.sin(Math.PI*p);
    if (!c.turned && p >= 0.5){ c.dir = c.dirWant; c.turned = true; }
    if (c.turnT <= 0){ c.turnSq = 1; c.dir = c.dirWant; }
  } else c.turnSq = 1;
}
function faceTowards(c, x){ turnTo(c, dirFor(x - c.x)); }
function faceNow(c, want){ c.dir = c.dirWant = want; c.turnT = 0; c.turnSq = 1; }

/* ---- jumping: a real arc, with a crouch, a stretch and a landing squash ---- */
function startJump(c, tx, ty, o){
  o = o || {};
  c.jump = {
    x0:c.x, y0:c.y, x1:tx, y1:ty,
    t: -(o.crouch === undefined ? 0.16 : o.crouch),
    dur: o.dur || 0.5,
    h:   o.h   || 30,
    onLand: o.onLand
  };
  c.spd = 0;
  resetGait(c);
  c.el.classList.add('crouch');
  if (Math.abs(tx - c.x) > 6) faceTowards(c, tx);
}
function stepJump(c, dt){
  const j = c.jump;
  j.t += dt;
  if (j.t < 0){ drawCat(c); return; }                /* still gathering itself */
  if (c.el.classList.contains('crouch')){
    c.el.classList.remove('crouch');
    c.el.classList.add('airborne');
  }
  const p = clamp(j.t/j.dur, 0, 1);
  const e = p*p*(3-2*p);                             /* ease the horizontal    */
  c.x = j.x0 + (j.x1-j.x0)*e;
  c.y = j.y0 + (j.y1-j.y0)*e - Math.sin(Math.PI*p)*j.h;
  c.stretch = 1 + Math.sin(Math.PI*p)*0.11;
  if ((c.turnT||0) > 0) faceMotion(c, 0, dt);
  drawCat(c);
  if (p >= 1){
    c.x = j.x1; c.y = j.y1; c.jump = null;
    c.stretch = 0.86;                                /* absorb the landing     */
    c.el.classList.remove('airborne','crouch');
    if (j.onLand) j.onLand();
    drawCat(c);
  }
}
function baseSpeed(c, running){
  return (running?58:24) * (0.75 + c.traits.agility/16) * (has(c,'speedy')?1.35:1)
       * (c.pace || 1) * (isKitten(c)?1.15:1) * (0.72 + depthScale(c.y)*0.4);
}

/* ============================================================
   8. FLOATS / TOASTS
   ============================================================ */
function floatAt(x, y, txt, delay){
  setTimeout(()=>{
    const f = document.createElement('div');
    f.className = 'float'; f.textContent = txt;
    f.style.left = (x-12)+'px'; f.style.top = (y-70)+'px';
    cafe.appendChild(f);
    setTimeout(()=>f.remove(), 1400);
  }, delay||0);
}
const floatCat = (c, txt, d) => floatAt(c.x, c.y - 22*depthScale(c.y), txt, d);

/* a cat that has just been petted, played with or fed looks pleased for a while */
function cheer(c, secs){
  c.cheerUntil = performance.now() + (secs||12)*1000;
}

let toastT = 0;
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast'+(kind?' '+kind:'');
  t.textContent = msg;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 3600);
}
function addHearts(n, why){
  if (n<=0) return;
  G.hearts += n;
  $('heartsTxt').textContent = G.hearts;
  toast('💗 +'+n+(why?'  '+why:''), 'reward');
  const chip = $('heartsChip');
  chip.style.transform='scale(1.12)'; setTimeout(()=>chip.style.transform='', 220);
  updateTopbar();
}

/* ============================================================
   9. BEHAVIOUR — naps, perches, baskets
   ============================================================ */
const freeSpots = kind => S.spots.filter(s=>!s.taken && (!kind || s.kind===kind));

function claimSpot(c, sp, mode){
  releaseSpot(c);
  sp.taken = c.id; c.spot = sp; c.spotMode = mode;
  headFor(c, sp.x, sp.groundY, sp.room, 'toSpot');
}
function releaseSpot(c){
  if (c.spot) c.spot.taken = null;
  c.spot = null; c.spotMode = null;
}
function settleOnSpot(c){
  const sp = c.spot;
  if (!sp) return;
  c.x = sp.x; c.y = sp.y;
  if (c.spotMode === 'sleep'){
    c.state = 'sleep'; c.el.classList.add('asleep'); c.wait = R(60,170);
  } else {
    c.state = 'lounge'; c.wait = R(18,55);
  }
}
function arriveSpot(c){
  const sp = c.spot;
  resetGait(c);
  if (!sp){ c.state='idle'; c.wait=R(1,3); return; }
  if (sp.elevated){
    const climb = Math.max(0, c.y - sp.y);
    c.state = 'jumping';
    startJump(c, sp.x, sp.y, {
      h: 26 + climb*0.30, dur: 0.34 + climb*0.0016, crouch: 0.2,
      onLand: ()=>{ if (c.state==='jumping') settleOnSpot(c); }
    });
  } else settleOnSpot(c);
}
function leaveSpot(c){
  const sp = c.spot;
  c.el.classList.remove('asleep');
  c.spot = null; c.spotMode = null;
  if (sp){
    sp.taken = null;
    if (sp.elevated){
      const gy = sp.groundY, gx = clamp(sp.x + R(-26,26), 40, S.W-40);
      c.state = 'jumping';
      startJump(c, gx, gy, {
        h: 16, dur: 0.30 + Math.max(0, gy-c.y)*0.0012, crouch: 0.12,
        onLand: ()=>{ if (c.state==='jumping'){ c.state='idle'; c.wait=R(.3,1.2); } clampFloor(c); }
      });
      return;
    }
    c.x = sp.x; c.y = sp.groundY;
  }
  c.state = 'idle'; c.wait = R(.4,1.6);
  clampFloor(c);
}
function goSleep(c){
  releaseBowl(c);
  const here = s => s.room === undefined || s.room === roomIx(c);
  let beds = freeSpots('bed').filter(here), high = freeSpots('perch').filter(here);
  if (!beds.length && !high.length){ beds = freeSpots('bed'); high = freeSpots('perch'); }
  let sp = null;
  const quietest = list => list.reduce((a,b)=>
    crowdAt(b.x, b.groundY, b.room, c) < crowdAt(a.x, a.groundY, a.room, c) ? b : a);
  if (has(c,'acrobat') && high.length && chance(.92))        sp = quietest(high);
  else if (high.length && chance(.62))                       sp = quietest(high);   /* up a tree */
  else if (beds.length && chance(.8))                        sp = quietest(beds);
  else if (high.length && !isKitten(c))                      sp = quietest(high);
  else if (beds.length)                                      sp = quietest(beds);
  if (sp){ claimSpot(c, sp, 'sleep'); return; }
  /* every bed taken — curl up where they are */
  c.state = 'sleep'; c.el.classList.add('asleep');
  resetGait(c);
  c.wait = R(50,140);
}
function goLounge(c){
  let high = freeSpots('perch').filter(s=>s.room === undefined || s.room === roomIx(c));
  if (!high.length) high = freeSpots('perch');
  if (!high.length) return false;
  claimSpot(c, pick(high), 'lounge');
  return true;
}
function wake(c, force){
  if (c.state!=='sleep' && c.state!=='lounge') return;
  if (c.state==='sleep' && has(c,'lazy') && !force && chance(.55)) return;
  if (c.spot) leaveSpot(c);
  else { c.el.classList.remove('asleep'); c.state='idle'; c.wait=R(.3,1.2); }
}
function releaseBowl(c){
  S.bowls.forEach(b=>{ if (b.taken===c.id){ b.taken=null; b.el.classList.remove('called'); } });
  c.mission = false;
  c.el && c.el.classList.remove('eating');
}
function wantsFood(c){ return c.hunger < 82 && (G.t - (c.fedAt||-9999)) > 45; }
function freeBowl(c){
  const all = S.bowls.filter(b=>b.food>0 && (!b.taken || b.taken===c.id));
  if (!all.length) return null;
  const mine = all.filter(b=>b.room === undefined || b.room === roomIx(c));
  const opts = mine.length ? mine : all;
  /* the quietest bowl within reach, so mealtimes don't turn into a huddle */
  let best = opts[0], bestScore = Infinity;
  opts.forEach(b=>{
    const s = crowdAt(b.x, b.y, b.room===undefined ? roomIx(c) : b.room, c)
            + Math.abs(b.x - c.x)/900;
    if (s < bestScore){ bestScore = s; best = b; }
  });
  return best;
}
/* stand next to the bowl on the side the cat comes from, close enough that its
   head — which sits well forward of the body — ends up right over the food */
function headOffset(b){ return 34*depthScale(b.y); }
function aimAtBowl(c, b){
  c.eatSide = (c.x >= b.x) ? 1 : -1;                 /* 1 = stand to the right of it */
  c.tx = clamp(b.x + c.eatSide*headOffset(b), 30, S.W-30);
  c.ty = clamp(b.y - 3, S.backY+6, S.frontY);
}
function goEat(c){
  const b = freeBowl(c); if (!b) return false;
  c.nibble = null; c.watch = null; c.watchAt = null; c.critter = null; c.scratch = null; c.scratchAt = null; c.drink = null; c.drinkAt = null; c.litter = null; c.litterAt = null;
  if (c.spot) leaveSpot(c);
  b.taken = c.id; c.bowl = b; c.state='toBowl';
  routeToBowl(c, b);
  return true;
}
/* aimAtBowl sets tx/ty directly; route through the doorway if the bowl is next door */
function routeToBowl(c, b){
  aimAtBowl(c, b);
  if ((b.room !== undefined) && b.room !== roomIx(c) && ROOMS.length > 1){
    headFor(c, c.tx, c.ty, b.room, 'toBowl');
  } else { c.travel = 0; c.bestD = Infinity; }
}
/* a drink at the fountain */
function goDrink(c){
  const mine = S.founts.filter(f=>f.room === roomIx(c))
                       .filter(f=>!G.cats.some(o=>o!==c && o.drinkAt===f));
  if (!mine.length) return false;
  const f = pick(mine);
  const fy = clamp(f.y + 4, S.backY+8, S.frontY);
  const [fa,fb] = floorBounds(fy, roomIx(c));
  const side = f.x > (fa+fb)/2 ? -1 : 1;
  c.drink = f; c.drinkAt = f;
  c.tx = clamp(f.x + side*34*depthScale(fy), fa+20, fb-20);
  c.ty = fy; c.state = 'walk';
  c.travel = 0; c.bestD = Infinity;
  return true;
}
function drinkFrom(c){
  const f = c.drink; c.drink = null;
  if (!f){ c.state='idle'; c.wait=R(1,3); return; }
  c.state = 'drinking'; c.wait = R(4,8);
  resetGait(c);
  c.el.classList.add('eating');                    /* the same head-down pose */
  c.eatSide = c.x >= f.x ? 1 : -1;
  faceNow(c, c.eatSide > 0 ? FACE_L : FACE_R);
  c.happy = clamp(c.happy + 2, 0, 100);
  floatCat(c, '💧');
}

/* a trip to the litter tray: hop in, a quiet moment, hop out */
function goLitter(c){
  const mine = S.litters.filter(l=>l.room === roomIx(c))
                        .filter(l=>!G.cats.some(o=>o!==c && o.litterAt===l));
  if (!mine.length) return false;
  const l = pick(mine);
  const ly = clamp(l.y + 8, S.backY+8, S.frontY);
  const [la,lb] = floorBounds(ly, roomIx(c));
  c.litter = l; c.litterAt = l;
  c.tx = clamp(l.x + 56*l.scale, la+20, lb-20);    /* stand beside it first */
  c.ty = ly; c.state = 'walk';
  c.travel = 0; c.bestD = Infinity;
  return true;
}
function enterLitter(c){
  const l = c.litter; c.litter = null;
  if (!l){ c.state='idle'; c.wait=R(1,3); return; }
  c.state = 'litter'; c.wait = 5;                  /* five seconds of privacy */
  startJump(c, l.x, l.y - 16*l.scale, {h:28*l.scale, dur:.34, crouch:.14, onLand:()=>{
    if (c.state !== 'litter') return;
    c.el.classList.add('inbox');
    setTimeout(()=>{ if (c.el && c.state==='litter') c.el.classList.add('digging'); }, 900);
    setTimeout(()=>c.el && c.el.classList.remove('digging'), 2600);
  }});
}
function leaveLitter(c){
  const l = c.litterAt;
  c.el.classList.remove('inbox','digging');
  c.litterAt = null;
  if (!l){ c.state='idle'; c.wait=R(1,3); return; }
  const ly = clamp(l.y + 14*l.scale, S.backY+8, S.frontY);
  const [la,lb] = floorBounds(ly, roomIx(c));
  const out = clamp(l.x + (chance(.5)?-1:1)*70*l.scale, la+20, lb-20);
  c.state = 'jumping';
  startJump(c, out, ly, {h:24*l.scale, dur:.32, crouch:.10, onLand:()=>{
    if (c.state==='jumping'){ c.state='idle'; c.wait=R(.4,1.4); }
    clampFloor(c);
  }});
}

/* head over to a free post for a scratch */
function goScratch(c){
  if (!S.posts.length) return false;
  const mine = S.posts.filter(p=>p.room === roomIx(c))
                      .filter(p=>!G.cats.some(o=>o!==c && o.scratchAt===p));
  if (!mine.length) return false;
  const p = pick(mine);
  const side = chance(.5) ? -1 : 1;
  const py = clamp(p.y - 2, S.backY+8, S.frontY);
  const [pa,pb] = floorBounds(py, roomIx(c));
  c.scratch = p; c.scratchAt = p;
  c.tx = clamp(p.x + side*30*depthScale(py), pa+20, pb-20);
  c.ty = py; c.state = 'walk';
  c.travel = 0; c.bestD = Infinity;
  return true;
}
function scratchPost(c){
  const p = c.scratch;
  c.scratch = null;
  if (!p){ c.state='idle'; c.wait=R(1,3); return; }
  c.state = 'scratching';
  c.wait = R(3.5, 8);
  resetGait(c);
  c.el.classList.add('scratching');
  faceTowards(c, p.x);
  c.happy  = clamp(c.happy + 5, 0, 100);
  c.energy = clamp(c.energy - 2, 0, 100);
  floatCat(c, '✨');
  floatCat(c, pick(['🐾','✨']), 900);
  cheer(c, 12);
}
function watchFish(c){
  const t = c.watch;
  c.watch = null;
  if (!t){ c.state='idle'; c.wait=R(1,3); return; }
  c.state = 'watching'; c.watchAt = t;
  c.wait = R(10,26) + (1-(c.temper===undefined?0.6:c.temper))*R(5,20);
  resetGait(c);
  faceNow(c, FACE_L);                                  /* the glass is on their left */
  c.happy = clamp(c.happy + 3, 0, 100);
  floatCat(c, '🐠');
  floatCat(c, '👀', 700);
}
function nibbleGrass(c){
  const g = c.nibble;
  c.nibble = null;
  c.state = 'nibble'; c.wait = R(2.5,6);
  resetGait(c);
  if (g) faceTowards(c, g.x);
  c.happy  = clamp(c.happy + 4, 0, 100);
  c.hunger = clamp(c.hunger + 2, 0, 100);
  floatCat(c, '🌿');
  floatCat(c, '🌿', 900);
}
function decide(c){
  if (c.state==='sleep' || c.state==='eat' || c.state==='toSpot' || c.state==='lounge' ||
      c.state==='watching' || c.state==='scratching' || c.state==='drinking' || c.state==='litter') return;
  const night = isNight();
  const t0 = (c.temper === undefined) ? 0.6 : c.temper;
  /* a cat nap is a perfectly good way to spend the afternoon — calm cats most of all */
  const napUrge = 0.12 + (1-t0)*0.34 + (has(c,'lazy') ? 0.18 : 0) + (c.energy < 55 ? 0.15 : 0);
  const sleepy = c.energy < 30
              || (night && !has(c,'nightowl') && chance(.6))
              || (has(c,'lazy') && c.energy < 70 && chance(.35))
              || chance(napUrge);
  if (wantsFood(c) && freeBowl(c)) { goEat(c); return; }
  if (sleepy && !S.toys.length){ goSleep(c); return; }
  const t = (c.temper === undefined) ? 0.6 : c.temper;
  const roll = Math.random();
  if (!S.toys.length && roll < (has(c,'acrobat') ? 0.28 : 0.15) && goLounge(c)) return;
  /* a good scratch on one of the posts */
  if (!S.toys.length && roll > 0.83 && roll < 0.95 && goScratch(c)) return;
  /* a drink, or a visit to the tray */
  if (!S.toys.length && roll > 0.55 && roll < 0.62 && goDrink(c)) return;
  if (!S.toys.length && roll > 0.47 && roll < 0.55 && goLitter(c)) return;
  /* now and then, go and see what is happening in the room next door */
  if (ROOMS.length > 1 && !S.toys.length && roll > 0.82 && chance(0.6)){
    const other = roomIx(c) === 0 ? 1 : 0;
    const saved = c.room; c.room = other;
    const p = randomFloorSpot(c);
    c.room = saved;
    headFor(c, p.x, p.y, other, 'walk');
    return;
  }
  /* a spell in front of the fish tank */
  if (!S.toys.length && S.tanks.length && roll > 0.70 && roll < 0.83){
    const ready = S.tanks.filter(t=>t.geom);
    const mine = ready.filter(t=>t.room === roomIx(c));
    /* the aquarium is in the café room, so cats next door pop through to see it */
    const t = mine.length ? pick(mine) : (chance(.5) ? pick(ready) : null);
    if (t){
      /* stand anywhere along the glass, keeping clear of anyone already watching */
      let u = R(0.18, 0.92), best = -1;
      for (let k=0;k<6;k++){
        const cand = R(0.18, 0.92);
        const cy = t.geom.backY + (t.geom.frontY - t.geom.backY)*cand;
        let d = 1e9;
        G.cats.forEach(o=>{ if (o!==c && o.state==='watching') d = Math.min(d, Math.abs(o.y - cy)); });
        if (d > best){ best = d; u = cand; }
        if (best > 90) break;
      }
      const ty = clamp(t.geom.backY + (t.geom.frontY - t.geom.backY)*u, S.backY+8, S.frontY-4);
      const [wa,wb] = floorBounds(ty, t.room);
      const tx = clamp(wa + 58*depthScale(ty), wa + 8, wb - 40);
      c.watch = t;
      headFor(c, tx, ty, t.room, 'walk');
      return;
    }
  }
  /* a chew on the cat grass */
  if (!S.toys.length && S.grass.length && roll > 0.62 && roll < 0.72){
    const mine = S.grass.filter(g=>g.room === roomIx(c));
    const g = pick(mine.length ? mine : S.grass);
    c.nibble = g;
    c.ty = clamp(g.y + 4, S.backY+6, S.frontY);
    /* stand on whichever side of the pot the cat can actually reach */
    const [ga,gb] = floorBounds(c.ty);
    const gm = 60*depthScale(c.ty), off = 34*g.scale;
    let tx = g.x + (chance(.5) ? -off : off);
    if (tx < ga+gm || tx > gb-gm) tx = g.x - (tx - g.x);
    c.tx = clamp(tx, ga+gm, gb-gm);
    c.state = 'walk';
    return;
  }
  let walkP = 0.22 + 0.48*t;                      /* couch cat … busybody */
  /* nobody settles down in the middle of a huddle — they find their own patch first */
  if (crowdAt(c.x, c.y, roomIx(c), c) > 1.05) walkP = Math.max(walkP, 0.92);
  if (roll < walkP){
    const p = randomFloorSpot(c, chance(0.42 - 0.28*t));   /* mostly a proper wander */
    c.tx = p.x; c.ty = p.y; c.state='walk';
  } else if (roll < walkP + (1-walkP)*0.58){
    c.state='idle'; c.wait = R(4,12) + (1-t)*R(9,42);       /* a proper sit-down */
    if (has(c,'chatty') && chance(.4)) floatCat(c, pick(['🗨️','😺','💬']));
  } else {
    c.state='groom'; c.wait = R(4,10) + (1-t)*R(4,22);
    floatCat(c, '✨');
  }
}

/* nobody gets to walk in circles for ever */
function unstick(c){
  c.yielding = false; c.resume = null;
  c.travel = 0; c.bestD = Infinity; c.nibble = null; c.watch = null; c.critter = null;
  c.scratch = null; c.scratchAt = null; c.drink = null; c.drinkAt = null; c.litter = null; c.litterAt = null; c.crossTo = null;
  resetGait(c);
  if (c.state==='toBowl'){
    if (c.bowl && c.bowl.food > 0){ c.x = c.tx; c.y = c.ty; startEating(c); }
    else { releaseBowl(c); c.bowl = null; c.state='idle'; c.wait = R(.5,2); }
  } else if (c.state==='toSpot'){
    arriveSpot(c);
  } else if (c.state==='chase'){
    c.state='idle'; c.wait = R(.5,2);
  } else {
    c.state='idle'; c.wait = R(.6,2.5);
  }
}
/* is this cat on its final approach? then let it land instead of shoving it */
function landing(c){
  return (c.state==='toBowl' || c.state==='toSpot') &&
         Math.hypot(c.tx-c.x, (c.ty-c.y)*2) < 74;
}

/* keep cats out of each other's personal space (position-based, so it always wins) */
/* When two walking cats meet head-on, one of them gives way: it stops, steps aside,
   and then carries on to where it was going. Far calmer than shoving both. */
function giveWay(a, b){
  const now = performance.now();
  if (a.yielding || b.yielding) return;                  /* one of them is already moving over */
  if (now < (a.yieldUntil||0) || now < (b.yieldUntil||0)) return;
  /* whoever is on the less urgent errand steps aside; ties broken by id, so it never flips */
  const busy = c => (c.mission ? 3 : 0) + (c.state==='toBowl' ? 2 : 0) + (c.state==='toSpot' ? 1 : 0);
  const y = busy(a) === busy(b) ? (a.id < b.id ? a : b) : (busy(a) < busy(b) ? a : b);
  const o = y === a ? b : a;
  if (y.jump || y.state==='eat' || y.state==='sleep') return;

  y.yieldUntil = now + 2600;                 /* refreshed again when it finishes */
  y.resume = (y.state==='walk' || y.state==='toBowl' || y.state==='toSpot' || y.state==='chase')
    ? {x:y.tx, y:y.ty, state:y.state} : null;
  /* step out of the way, perpendicular to the other cat's approach */
  const dx = y.x - o.x, dy = (y.y - o.y);
  const len = Math.hypot(dx, dy) || 1;
  const s = depthScale(y.y);
  const [la,lb] = floorBounds(y.y, roomIx(y));
  y.tx = clamp(y.x + (dx/len)*92*s, la+24, lb-24);
  y.ty = clamp(y.y + (dy/len)*26*s + R(-10,10), S.backY+8, S.frontY);
  y.state = 'walk';
  y.hold = R(0.25, 0.6);                     /* a beat, then out of the way */
  y.travel = 0; y.bestD = Infinity;
  y.yielding = true;
}

function separate(dt){
  const n = G.cats.length;
  const step = clamp(dt*60, 0.5, 2);
  for (let pass=0; pass<2; pass++){
    for (let i=0;i<n;i++){
      const a = G.cats[i];
      if (!a.el) continue;
      if (a.jump) continue;                          /* mid-air */
      const aOn = a.spot && (a.state==='sleep' || a.state==='lounge');
      if (aOn && a.spot.elevated) continue;          /* up on a shelf — different plane */
      const sa = depthScale(a.y)*catScaleBase(a);
      for (let j=i+1;j<n;j++){
        const b = G.cats[j];
        if (!b.el) continue;
        if (b.jump) continue;
        const bOn = b.spot && (b.state==='sleep' || b.state==='lounge');
        if (bOn && b.spot.elevated) continue;
        if (aOn && bOn) continue;                     /* both settled in their own beds */
        const sb = depthScale(b.y)*catScaleBase(b);
        const rx = 104*(sa+sb)/2, ry = 60*(sa+sb)/2;
        let dx = a.x-b.x, dy = a.y-b.y;
        const ox = rx - Math.abs(dx), oy = ry - Math.abs(dy);
        if (ox <= 0 || oy <= 0) continue;
        if (dx === 0) dx = (i%2 ? 0.1 : -0.1);
        if (dy === 0) dy = (i%2 ? 0.1 : -0.1);
        const sx = Math.sign(dx), sy = Math.sign(dy);
        const px = Math.min(ox*0.45, 2.8) * step;
        const py = Math.min(oy*0.35, 2.0) * step;
        const aFixed = aOn || a.state==='eat' || a.state==='sleep' || landing(a);
        const bFixed = bOn || b.state==='eat' || b.state==='sleep' || landing(b);
        if (aFixed && bFixed) continue;
        /* both under way and heading into each other: one of them gives way */
        const closing = (a.selfMoved||0) > 6 && (b.selfMoved||0) > 6 &&
                        ((a.cueX||0) - (b.cueX||0)) * dx < 0;
        if (!aFixed && !bFixed && closing && !a.yielding && !b.yielding) giveWay(a, b);
        if (!aFixed){ a.x += sx*px*(bFixed?2:1); a.y += sy*py*(bFixed?2:1); }
        if (!bFixed){ b.x -= sx*px*(aFixed?2:1); b.y -= sy*py*(aFixed?2:1); }
        /* two cats aiming for the same patch of floor: send one somewhere else */
        if (a.state==='walk' && b.state==='walk' && Math.abs(a.tx-b.tx) < rx && Math.abs(a.ty-b.ty) < ry && chance(0.04)){
          const p = randomFloorSpot(b);
          b.tx = p.x; b.ty = p.y; b.travel = 0; b.bestD = Infinity;   /* fresh goal, fresh timer */
        }
      }
    }
  }
}

/* ============================================================
   10. SIMULATION
   ============================================================ */
let lastFrame = performance.now();
let simLast   = performance.now();

/* rendering / movement — animation frame (pauses when the tab is hidden) */
function frame(now){
  const dt = Math.min(0.05, (now-lastFrame)/1000);
  lastFrame = now;
  moveCats(dt);
  moveToys(dt);
  moveCritters(dt);
  moveFish(dt);
  requestAnimationFrame(frame);
}

/* café clock & needs — a real timer, so the cats keep living in a background tab */
function simLoop(){
  const now = performance.now();
  const dtReal = Math.min(3, (now-simLast)/1000);
  simLast = now;
  if (dtReal <= 0) return;
  G.t += dtReal * G.speed;
  simTick(dtReal, dtReal * G.speed);
}

function moveCats(dt){
  G.cats.forEach(c=>{
    if (!c.el) return;
    if (c.stretch === undefined) c.stretch = 1;
    if (c.jump){ stepJump(c, dt); return; }
    c.stretch += (1 - c.stretch) * Math.min(1, dt*9);

    if (c.state==='sleep' || c.state==='lounge'){
      resetGait(c);
      drawCat(c); return;
    }

    const moving = (c.state==='walk' || c.state==='toBowl' || c.state==='toSpot' || c.state==='chase');
    c.frameX = c.x; c.frameY = c.y;
    c.cueX = 0;

    if (moving && (c.hold||0) <= 0){
      const chasing = c.state==='chase';
      const running = chasing || (c.state==='toBowl' && c.hunger<40);
      const dx = c.tx - c.x, dy = c.ty - c.y;
      const d  = Math.hypot(dx,dy) || 0.001;

      /* stuck-detector: the timer only runs while a cat is making no headway.
         bestD relaxes over time so a moving target (or a new one) is not read as a jam. */
      if (c._ps !== c.state){ c._ps = c.state; c.travel = 0; c.bestD = Infinity; }
      c.bestD = (c.bestD === undefined ? Infinity : c.bestD) + dt*16;
      if (d < c.bestD - 6){ c.bestD = d; c.travel = 0; }
      c.travel = (c.travel||0) + dt;
      if (c.travel > 7){ unstick(c); return; }

      c.wantsRun = running;
      c.selfMoved = 0;
      if (c.critter && chasing) { /* the chase ends when the critter goes */ }
      if (d < (chasing ? 18 : 14)){
        /* reached the doorway — step through into the room next door and carry on */
        if (c.crossTo !== null && c.crossTo !== undefined){
          c.room = c.crossTo; c.crossTo = null;
          c.tx = c.finalX; c.ty = c.finalY;
          c.travel = 0; c.bestD = Infinity;
          clampFloor(c);
          return;
        }
        resetGait(c);
        c.spd = 0;
        if (c.yielding){                       /* stepped aside — now carry on */
          c.yielding = false;
          c.yieldUntil = performance.now() + 1200;   /* not again for a moment */
          const r = c.resume; c.resume = null;
          if (r){ c.tx = r.x; c.ty = r.y; c.state = r.state; c.travel = 0; c.bestD = Infinity; return; }
          c.state = 'idle'; c.wait = R(.4,1.6); return;
        }
        if (c.state==='toBowl')      startEating(c);
        else if (c.state==='toSpot') arriveSpot(c);
        else if (chasing){ c.state='idle'; c.wait=R(.4,1.4); }
        else if (c.litter){ enterLitter(c); }
        else if (c.drink){ drinkFrom(c); }
        else if (c.scratch){ scratchPost(c); }
        else if (c.watch){ watchFish(c); }
        else if (c.nibble){ nibbleGrass(c); }
        else { const t = (c.temper===undefined?0.6:c.temper); c.state='idle'; c.wait = R(2,6) + (1-t)*R(5,24); }
      } else {
        const maxS = baseSpeed(c, running);
        const want = Math.min(maxS, 9 + d*2.3);                 /* ease in, ease out */
        const ux0 = dx/d, uy0 = dy/d;

        /* --- look where you are going: steer around whoever is in the way --- */
        let ax = 0, ay = 0, brake = 1;
        const ri = roomIx(c);
        for (let k=0;k<G.cats.length;k++){
          const o = G.cats[k];
          if (o === c || !o.el || o.jump) continue;
          if (roomIx(o) !== ri) continue;
          if (o.spot && (o.state==='sleep' || o.state==='lounge') && o.spot.elevated) continue;
          const ox = o.x - c.x, oy = (o.y - c.y)*2.1;           /* depth counts double */
          const dist = Math.hypot(ox, oy);
          if (dist < 0.01 || dist > 170) continue;
          const ahead = (ox*ux0 + oy*uy0)/dist;                 /* 1 = straight in front */
          if (ahead < 0.2) continue;                            /* behind or beside: ignore */
          const near = 1 - dist/170;
          const w = near*near*(0.35 + 0.65*ahead);
          const px = -uy0, py = ux0;                            /* sidestep, away from them */
          const side = (ox*px + oy*py) > 0 ? -1 : 1;
          ax += px*side*w; ay += py*side*w*0.45;
          if (dist < 98 && ahead > 0.55) brake = Math.min(brake, clamp(dist/98, 0.10, 1));
        }
        /* if somebody really is in the way, stop and let them pass */
        if (brake < 0.35){
          c.blocked = (c.blocked||0) + dt;
          if (c.blocked > 1.0 && chance(0.05)){ c.hold = R(.5,1.5); c.blocked = 0; }
        } else c.blocked = 0;

        c.spd = (c.spd||0) + (want*brake - (c.spd||0)) * Math.min(1, dt*5);
        /* a lazy drift so nobody walks a perfectly straight line */
        c.wob = (c.wob===undefined ? Math.random()*6 : c.wob) + dt*1.7;
        const curve = Math.sin(c.wob) * (running ? 0.05 : 0.15) * Math.min(1, d/170);
        const ux = ux0 - uy0*curve + ax*1.6, uy = uy0 + ux0*curve + ay*1.6;
        const ul = Math.hypot(ux,uy) || 1;
        const mx = (ux/ul)*c.spd*dt, my = (uy/ul)*c.spd*dt;
        c.x += mx; c.y += my;
        c.selfMoved = Math.hypot(mx,my)/Math.max(dt,0.001);    /* under its own power */
        c.cueX = ux/ul;                                        /* where it means to go */
        c.wantsRun = running;
      }
    } else {
      if (c.hold > 0) c.hold -= dt;
      c.spd = (c.spd||0)*0.82;
      c.wantsRun = false;
      c.selfMoved = 0;
    }
  });

  separate(dt);

  G.cats.forEach(c=>{
    if (!c.el || c.jump) return;
    const onSpot = c.spot && (c.state==='sleep' || c.state==='lounge');
    if (!onSpot) clampFloor(c);

    /* Legs only move if the cat is walking under its own power. Being nudged by a
       neighbour must never start the walk cycle — that was the flicker. */
    const moved = c.selfMoved || 0;
    /* the legs stop quickly when a cat brakes, but ease in when it sets off */
    const kv = moved < (c.vis||0) ? 0.5 : 0.3;
    c.vis = (c.vis||0)*(1-kv) + moved*kv;

    if (c.state !== 'scratching' && c.el.classList.contains('scratching')) c.el.classList.remove('scratching');
    if (c.state !== 'litter' && c.el.classList.contains('inbox')) c.el.classList.remove('inbox','digging');

    /* ---- gait, with hysteresis so brushing past another cat cannot make it flicker ---- */
    const moveState = (c.state==='walk' || c.state==='toBowl' || c.state==='toSpot' || c.state==='chase');
    const wasGoing = (c.gaitMode === 'walk' || c.gaitMode === 'run');
    const going = moveState && !(c.hold > 0) && (wasGoing ? c.vis > 9 : c.vis > 15);
    const wasRun = (c.gaitMode === 'run');
    const running = going && (c.wantsRun || (wasRun ? c.vis > 38 : c.vis > 52));
    let want = running ? 'run' : going ? 'walk'
             : (!onSpot && (c.state==='idle' || c.state==='groom' || c.state==='nibble' || c.state==='watching' || c.state==='scratching' ||
                            c.state==='drinking' || c.state==='litter' ||
                            c.state==='walk' || c.state==='toBowl' || c.state==='toSpot')) ? 'rest' : 'none';

    /* a mode has to hold for a moment before it is applied — no single-frame flips */
    if (want !== c.gaitWant){ c.gaitWant = want; c.gaitFor = 0; }
    else c.gaitFor = (c.gaitFor||0) + dt;
    const settled = c.gaitFor > (want === 'rest' ? 0.20 : 0.10);
    if (c.gaitMode === undefined) c.gaitMode = 'none';
    if (want !== c.gaitMode && settled){
      c.gaitMode = want;
      c.el.classList.toggle('running', want === 'run');
      c.el.classList.toggle('walking', want === 'walk');
      c.el.classList.toggle('resting', want === 'rest');
    }

    /* The step rate uses a handful of fixed speeds. Rewriting animation-duration makes the
       cycle jump, so a cat only changes gear once its speed is clearly inside the next band. */
    if (c.gaitMode === 'walk' || c.gaitMode === 'run'){
      const cur = (c.gaitStep === undefined) ? -1 : c.gaitStep;
      let step = cur;
      for (let k = 0; k < GAIT_STEPS.length; k++){
        const g = GAIT_STEPS[k];
        const lo = g.from * (k === cur + 1 ? 1.14 : 1);      /* must clear the band to change up */
        const hi = g.to   * (k === cur - 1 ? 0.88 : 1);      /* … and drop well below to change down */
        if (c.vis >= lo && c.vis < hi){ step = k; break; }
      }
      if (step < 0) step = 0;
      if (step !== c.gaitStep){
        c.gaitStep = step;
        c.el.style.setProperty('--gait', GAIT_STEPS[step].dur);
      }
    }

    /* a cat that is shoved a long way sideways steps round to face that way */
    if (!c.cueX && c.state!=='eat'){
      c.slide = (c.slide||0)*0.985 + (c.x - (c.frameX||c.x));
      if (Math.abs(c.slide) > 26){ c.cueX = Math.sign(c.slide); c.slide = 0; }
    } else c.slide = 0;
    faceMotion(c, c.cueX||0, dt);
    drawCat(c);
  });
}

function startEating(c){
  const b = c.bowl;
  if (!b || b.food<=0){ c.state='idle'; c.wait=1; releaseBowl(c); return; }
  c.state='eat'; c.el.classList.add('eating');
  resetGait(c);
  const token = (c.eatToken = (c.eatToken||0) + 1);
  /* line up with the bowl and put the head down into it */
  c.x = b.x + (c.eatSide||1)*headOffset(b);
  c.y = b.y - 3;
  faceNow(c, (c.eatSide||1) > 0 ? FACE_L : FACE_R);
  drawCat(c);
  const treat = b.treat;
  setTimeout(()=>{
    if (!c.el || c.eatToken !== token) return;      /* this meal was interrupted */
    c.mission = false;
    b.el.classList.remove('called');
    b.food = Math.max(0, b.food-1);
    if (!b.food){
      b.el.classList.remove('full','bowl-treat','food-wet','food-dry','food-treat');
      if (!b.personal){ b.kind = 'meal'; b.treat = false; }
    }
    const F = FOODS[b.kind] || null;
    const appetite = (has(c,'picky') ? 0.62 : has(c,'glutton') ? 1.3 : 1);
    const portion = F ? F.fill*appetite
                      : ((has(c,'picky') ? 16 : has(c,'glutton') ? 34 : 26) + c.traits.appetite);
    c.hunger = clamp(c.hunger + portion, 0, 100);
    c.happy  = clamp(c.happy + (F ? (treat && has(c,'gourmet') ? F.happy*2 : F.happy)
                                  : (treat ? (has(c,'gourmet')?18:9) : 6)), 0, 100);
    c.bond   = clamp(c.bond + (F ? F.bond : (treat?3:1.5)), 0, 100);
    c.meals++; c.fedAt = G.t; cheer(c, 14);
    floatCat(c, treat ? '😻' : '😋');
    c.el.classList.remove('eating');
    releaseBowl(c);
    const away = randomFloorSpot(c);                 /* a stroll after dinner */
    c.tx = away.x; c.ty = away.y; c.state = 'walk';
    c.travel = 0; c.bestD = Infinity;
    if (b.personal){
      S.bowls = S.bowls.filter(x=>x!==b);
      setTimeout(()=>b.el.remove(), 900);
    }
    /* a well-fed cat is a happy cat */
    floatCat(c, '💗', 300);
    if (b.personal || FOODS[b.kind]) addHearts(1, c.name+' enjoyed that');
    if (treat && S.treatSession){ S.treatSession.add(c.id); }
    updateTopbar();
  }, 2400);
}

function simTick(dtReal, dtGame){
  const night = isNight();

  tendBowls(dtReal);
  G.cats.forEach(c=>{
    /* --- needs --- */
    const appetiteRate = 0.10 * (0.7 + c.traits.appetite/14) * (has(c,'glutton')?1.35:1) * (has(c,'picky')?0.85:1);
    c.hunger = clamp(c.hunger - appetiteRate*dtGame, 0, 100);
    let happyRate = 0.030 * (has(c,'zen')?0.45:1);
    if (c.hunger < 22) happyRate += 0.05;
    if (has(c,'sunbather')) happyRate *= night ? 1.4 : 0.7;
    if (has(c,'nightowl'))  happyRate *= night ? 0.7 : 1.1;
    c.happy = clamp(c.happy - happyRate*dtGame, 34, 100);   /* they never get truly unhappy */
    if (c.state==='sleep'){
      c.energy = clamp(c.energy + 0.5*dtGame, 0, 100);
      c.happy  = clamp(c.happy + 0.02*dtGame, 0, 100);
    } else if (c.state==='lounge'){
      c.energy = clamp(c.energy + 0.12*dtGame, 0, 100);
      c.happy  = clamp(c.happy + 0.03*dtGame, 0, 100);
    } else {
      c.energy = clamp(c.energy - 0.12*(has(c,'lazy')?0.6:1)*dtGame, 0, 100);
    }
    c.bond = clamp(c.bond - 0.006*dtGame, 0, 100);

    /* --- decisions --- */
    if (c.jump || c.state==='jumping') return;
    c.wait -= dtReal;
    /* cats stop mid-stroll to look at nothing in particular */
    if (c.state==='walk' && !(c.hold>0) && crowdAt(c.x, c.y, roomIx(c), c) < 1.0 &&
        chance(0.014 + (1-(c.temper===undefined?0.6:c.temper))*0.022)) c.hold = R(.6,2.6);
    if (c.state==='sleep'){
      if ((c.energy > 96 && c.wait <= 0) || (!night && c.hunger < 26)) wake(c);
      else if (c.wait <= 0){ c.wait = R(35,110); if (chance(.3)) wake(c); }
    } else if (c.state==='walk'){
      /* somewhere else got busy while we were walking to it */
      if (!c.yielding && !c.nibble && !c.watch && !c.scratch && !c.drink && !c.litter &&
          chance(0.06*dtReal*10) && crowdAt(c.tx, c.ty, roomIx(c), c) > 1.5){
        const p = randomFloorSpot(c);
        if (crowdAt(p.x, p.y, roomIx(c), c) < 0.9){
          c.tx = p.x; c.ty = p.y; c.travel = 0; c.bestD = Infinity;
        }
      }
    } else if (c.state==='drinking'){
      if (c.wait <= 0 || S.toys.length){
        c.el.classList.remove('eating'); c.drinkAt = null;
        c.state='idle'; c.wait = R(1,3);
      }
    } else if (c.state==='litter'){
      if (!c.jump && c.wait <= 0) leaveLitter(c);
    } else if (c.state==='scratching'){
      if (c.wait <= 0 || S.toys.length){ c.scratchAt = null; c.state='idle'; c.wait = R(1,3); }
    } else if (c.state==='watching'){
      c.happy = clamp(c.happy + 0.09*dtGame, 0, 100);          /* quietly mesmerising */
      if (chance(0.012)) floatCat(c, pick(['🐟','👀','🐠']));
      if (c.wait <= 0 || (wantsFood(c) && freeBowl(c)) || S.toys.length){
        c.watchAt = null; c.state='idle'; c.wait = R(1,3);
      }
    } else if (c.state==='nibble'){
      if (c.wait <= 0){ c.state='idle'; c.wait = R(1,3); }
    } else if (c.state==='toBowl'){
      if (!c.bowl || c.bowl.food <= 0){ releaseBowl(c); c.bowl=null; c.state='idle'; c.wait=R(.4,1.6); }
    } else if (c.state==='lounge'){
      if (c.wait <= 0 || (wantsFood(c) && freeBowl(c)) || (S.toys.length && chance(.3))) leaveSpot(c);
    } else if (c.state==='idle' || c.state==='groom'){
      if (c.wait <= 0) decide(c);
      else if (wantsFood(c) && c.hunger < 62 && freeBowl(c) && chance(.12)) goEat(c);
      else if (!S.toys.length && !night && chance(0.05*dtReal*10) &&
               chance(0.35 + (1-(c.temper===undefined?0.6:c.temper))*0.5)){ goSleep(c); }
      else if (!S.toys.length && chance(0.020*dtReal*10) && goScratch(c)){ /* off for a scratch */ }
      else if (!S.toys.length && chance(0.012*dtReal*10) && goDrink(c)){ /* a drink */ }
      else if (!S.toys.length && chance(0.008*dtReal*10) && goLitter(c)){ /* the tray */ }
      else {
        const crowd = crowdAt(c.x, c.y, roomIx(c), c);
        /* the bigger the huddle, the sooner somebody wanders off */
        if (crowd > 0.95 && chance(Math.min(0.5, (crowd-0.85)*0.22)*dtReal*10)){
          const p = randomFloorSpot(c);
          if (crowdAt(p.x, p.y, roomIx(c), c) < crowd*0.6){
            c.tx = p.x; c.ty = p.y; c.state = 'walk';
            c.travel = 0; c.bestD = Infinity;
          }
        }
      }
    }
    /* charmer cheers neighbours */
    if (has(c,'charmer') && chance(0.02*dtReal*10)){
      G.cats.forEach(o=>{ if (o!==c && Math.abs(o.x-c.x)<150) o.happy = clamp(o.happy+0.6,0,100); });
    }
    if (has(c,'mischief') && c.state==='idle' && chance(0.004)) floatCat(c, pick(['😼','🫗','💥']));
    /* kittens and springy cats skip along as they walk */
    if (c.state==='walk' && !c.jump && !(c.hold>0) &&
        (isKitten(c) || has(c,'acrobat') || has(c,'speedy')) && chance(0.02)){
      const dx = c.tx - c.x, dy = c.ty - c.y, d = Math.hypot(dx,dy);
      if (d > 70){
        const k = Math.min(52, d*0.45)/d;
        const [ba,bb] = floorBounds(c.y, roomIx(c));
        startJump(c, clamp(c.x + dx*k, ba+40, bb-40), clamp(c.y + dy*k, S.backY+6, S.frontY),
                  {h:20, dur:.34, crouch:.08, onLand:()=>{ if (c.state==='walk'){ c.spd = baseSpeed(c,false); } }});
      }
    }

    /* kittens grow up */
    if (!c.grown && !isKitten(c)){
      c.grown = true;
      floatCat(c,'✨'); floatCat(c,'🎂',260);
      toast('🐱 '+c.name+' is all grown up!');
    }
  });

  /* now and then something flutters or scurries in */
  if (!S.critters.length && !S.toys.length && chance(0.022*dtReal)){
    spawnCritter(isNight() || chance(.35) ? 'wildmouse' : 'butterfly');
  }

  /* the café ticks along contentedly and that alone earns a little affection */
  G.homes = (G.homes||0) + dtReal;
  if (G.homes > 12){ G.homes = 0; assignHomes(); }

  G.calm = (G.calm||0) + dtReal;
  if (G.calm > 55){
    G.calm = 0;
    const avg = G.cats.reduce((s,c)=>s+c.happy,0)/Math.max(1,G.cats.length);
    addHearts(avg >= 70 ? 2 : 1, 'a contented café');
  }

  advanceClock();
  updateTopbar();
  if (S.specOpenId) refreshSpecBars();
}

/* ---- the day turning over, and the light ---- */
function advanceClock(){
  const d = day();
  if (d !== G.lastDay){
    G.lastDay = d;
    toast('🌅 Day '+d+' at the café');
    save();
  }
  /* day / night visuals */
  const night = isNight();
  const dusk  = hh() >= 19 || hh() < 8;                 /* the lamps come on early evening */
  $('nightVeil').style.opacity = night ? 0.62 : (hh()>=20||hh()<7 ? 0.28 : 0);
  $('indoorLight').style.opacity = night ? 1 : (dusk ? 0.55 : 0);
  cafe.classList.toggle('lights-on', dusk);
  document.querySelectorAll('.r-window').forEach(w=>w.classList.toggle('night', night));
  document.querySelectorAll('.r-sun').forEach(s=>{ s.style.opacity = night?0:1; s.style.top = (10 + Math.abs(13-hh())*2.4)+'%'; });
  document.querySelectorAll('.r-moon').forEach(m=>m.style.opacity = night?1:0);
}

/* ============================================================
   11. FOOD & TREATS
   ============================================================ */
const FOODS = {
  wet:   {icon:'🥫', name:'Wet food', note:'A proper meal — fills them up',      fill:38, happy:8,  bond:2, meal:true,  cool:40, css:'food-wet'},
  dry:   {icon:'🍖', name:'Dry food', note:'A handful of kibble',                fill:24, happy:3,  bond:1, meal:false, cool:25, css:'food-dry'},
  treat: {icon:'🐟', name:'Treat',    note:'Barely food. Utterly worth it.',     fill:9,  happy:16, bond:5, meal:false, cool:12, css:'food-treat'}
};

/* --- the little bowl next to a cat --- */
function openFeedMenu(id){
  const c = G.cats.find(x=>x.id===id); if (!c) return;
  const m = $('feedMenu');
  S.feedFor = id;
  const wait = k => Math.max(0, Math.ceil(FOODS[k].cool - (G.t - (c.fedAt||-9999))));
  m.innerHTML = '<div class="fm-title">Feed '+c.name+'</div>' +
    Object.keys(FOODS).map(k=>{
      const f = FOODS[k], w = wait(k);
      return '<button class="fm-opt" '+(w?'disabled':'')+' onclick="handFeed(\''+c.id+'\',\''+k+'\')">'+
        '<span class="fm-ic">'+f.icon+'</span><span>'+f.name+
        '<small>'+(w ? 'still full — '+w+' min' : f.note)+'</small></span></button>';
    }).join('');
  m.classList.add('open');
  /* hold the cat still while you decide, and highlight it */
  G.cats.forEach(o=>o.el && o.el.classList.remove('selected'));
  c.el.classList.add('selected');
  if (c.state==='walk' || c.state==='chase'){ c.state='idle'; c.wait = 5; resetGait(c); }
  const w = m.offsetWidth, h = m.offsetHeight;
  const s = (c.spot && (c.state==='sleep'||c.state==='lounge')) ? c.spot.scale : depthScale(c.y);
  m.style.left = clamp(c.x - w/2, 8, S.W - w - 8)+'px';
  m.style.top  = clamp(c.y - 96*s - h, 8, S.H - h - 8)+'px';
}
function closeFeedMenu(){
  if (S.feedFor){ const c = G.cats.find(x=>x.id===S.feedFor); if (c && c.el && !S.specOpenId) c.el.classList.remove('selected'); }
  S.feedFor = null;
  $('feedMenu').classList.remove('open');
}
cafe.addEventListener('pointerdown', ev=>{ if (!ev.target.closest('#feedMenu') && !ev.target.closest('.feed-btn')) closeFeedMenu(); });

function handFeed(id, kind){
  const c = G.cats.find(x=>x.id===id), f = FOODS[kind];
  if (!c || !f) return;
  closeFeedMenu();
  if (G.t - (c.fedAt||-9999) < f.cool){ toast(c.name+' is still full 🐾'); return; }
  wake(c, true);
  if (c.spot) leaveSpot(c);
  releaseBowl(c);
  c.eatToken = (c.eatToken||0) + 1;          /* abandon any meal already under way */
  c.el.classList.remove('eating');
  c.nibble = null;
  c.mission = true;

  /* the food goes into a bowl in the diner — the cat walks over to it */
  const mine = x => !x.personal && !x.taken && (x.room === undefined || x.room === roomIx(c));
  let b = S.bowls.filter(x=>mine(x) && x.food<=0)[0]
       || S.bowls.filter(mine)[0]
       || S.bowls.filter(x=>!x.personal && !x.taken && x.food<=0)[0]
       || S.bowls.filter(x=>!x.personal && !x.taken)[0];
  if (!b){                                        /* every bowl busy: put one out at the end */
    const p = floorX(0.44, 0.72, roomIx(c));
    const s = depthScale(p.y);
    const el = document.createElement('div');
    el.className = 'bowl';
    el.innerHTML = bowlHTML();
    el.style.width = (60*s)+'px'; el.style.height = (34*s)+'px';
    el.style.left = (p.x - 30*s)+'px'; el.style.top = (p.y - 34*s)+'px';
    el.style.zIndex = catZ(p.y)+1;
    cafe.appendChild(el);
    b = {el, food:0, kind:'meal', treat:false, taken:null, x:p.x, y:p.y, personal:true, room:roomIx(c)};
    S.bowls.push(b);
  }
  b.food = Math.max(1, b.food);
  b.kind = kind; b.treat = (kind === 'treat'); b.taken = c.id;
  b.el.classList.remove('bowl-treat','food-wet','food-dry','food-treat');
  b.el.classList.add('full', f.css);

  c.bowl = b; c.state = 'toBowl';
  routeToBowl(c, b);
  b.el.classList.add('called');
  floatCat(c, f.icon);
  floatCat(c, '🥣', 420);
  toast(f.icon + ' ' + f.name + ' in the diner — ' + c.name + ' is on the way');

  /* if they never turn up, stop holding the bowl for them */
  setTimeout(()=>{
    b.el.classList.remove('called');
    if (b.taken !== c.id || c.state === 'eat') return;
    b.taken = null; c.mission = false;
    if (b.personal && S.bowls.includes(b)){
      S.bowls = S.bowls.filter(x=>x!==b);
      b.el.remove();
      if (c.bowl === b){ c.bowl = null; if (c.state==='toBowl'){ c.state='idle'; c.wait=R(.5,2); } }
    }
  }, 45000);
}

/* The café looks after itself: any empty bowl is quietly refilled a little later,
   and the cats wander over and eat whenever they feel like it. */
function tendBowls(dtReal){
  S.bowls.forEach(b=>{
    if (b.personal) return;
    if (b.food > 0){ b.refill = 0; b.refillAt = 0; return; }
    if (!b.refillAt) b.refillAt = R(12, 26);
    b.refill = (b.refill||0) + dtReal;
    if (b.refill > b.refillAt){
      b.refill = 0; b.refillAt = 0;
      b.food = 2 + RI(0,1);
      b.kind = 'meal'; b.treat = false;
      b.el.classList.remove('bowl-treat','food-wet','food-dry','food-treat');
      b.el.classList.add('full');
    }
  });
}

function serveMeal(){
  const per = Math.ceil(G.cats.length/5)+2;
  S.bowls.filter(b=>!b.personal).forEach(b=>{
    b.food = Math.max(b.food, per); b.treat=false; b.kind='meal'; b.taken=null;
    b.el.classList.add('full'); b.el.classList.remove('bowl-treat','food-wet','food-dry','food-treat');
  });
  toast('🍽 Fresh food in every bowl.');
  G.cats.forEach(c=>{
    if (c.state==='sleep' && c.hunger < 72 && chance(.5)) wake(c, true);
    if (c.state!=='eat' && c.state!=='toBowl' && wantsFood(c)) setTimeout(()=>{ if(c.state!=='eat') goEat(c); }, R(0,2400));
  });
  updateTopbar(); save();
}

function giveTreat(){
  const now = Date.now();
  if (now < G.treatReadyAt) return;
  G.treatReadyAt = now + 60000;
  const b = pick(S.bowls.filter(x=>!x.personal));
  b.food = Math.max(b.food, Math.ceil(G.cats.length/2)); b.treat = true; b.kind='treat'; b.taken=null;
  b.el.classList.add('full','bowl-treat');
  S.treatSession = new Set();
  toast('🐟 Treats in the bowl.');
  G.cats.forEach(c=>{
    if (c.state==='sleep' && chance(.8)) wake(c, true);
    if (c.state!=='eat'){ setTimeout(()=>{ if(c.state!=='eat'){ if (c.spot) leaveSpot(c); c.bowl=b; c.state='toBowl'; routeToBowl(c,b); } }, R(0,1200)); }
    c.happy = clamp(c.happy + (has(c,'gourmet')?6:3),0,100);
    cheer(c, 10);
  });
  setTimeout(()=>{
    const n = S.treatSession ? S.treatSession.size : 0;
    if (n >= 3) addHearts(1, 'treat time');
    S.treatSession = null;
    S.bowls.filter(x=>!x.personal).forEach(b2=>{ if(b2.treat){ b2.treat=false; b2.kind='meal'; b2.food=0; b2.el.classList.remove('full','bowl-treat'); } });
  }, 14000);
  updateTopbar();
}

/* ============================================================
   12. TOYS & PLAY
   ============================================================ */
function excite(c, toy){
  if (c.state==='eat' || c.jump || c.state==='jumping') return;
  if (c.mission) return;                     /* on its way to a bowl — food first */
  c.critter = null;
  c.nibble = null; c.watch = null; c.watchAt = null; c.scratch = null; c.scratchAt = null;
  c.drink = null; c.drinkAt = null; c.litter = null; c.litterAt = null;
  if (c.state==='litter' || c.state==='drinking') return;          /* leave them in peace */
  if (c.state==='sleep' || c.state==='lounge'){ if (chance(has(c,'lazy')?0.25:0.8)) wake(c, true); else return; }
  if (c.spot) leaveSpot(c);
  const eager = c.traits.playful/10 + (has(c,'hunter')?0.4:0) - (has(c,'shy')?0.25:0) - (has(c,'lazy')?0.2:0);
  if (chance(clamp(eager,0.15,1))){ c.state='chase'; c.toy = toy; c.chaseOff = R(-78,78); c.chaseDepth = R(-22,26); }
}
function busiestRoom(){
  if (ROOMS.length < 2) return 0;
  const n = ROOMS.map(()=>0);
  G.cats.forEach(c=>{ n[roomIx(c)]++; });
  return n[1] > n[0] ? 1 : 0;
}
function spawnToy(kind){
  if (S.toys.length >= 3) return;
  const el = document.createElement('div');
  const y0 = S.floorTop + (S.floorBot-S.floorTop)*R(0.2,0.7);
  const ri = busiestRoom();
  const [ta,tb] = roomBounds(y0, ri);
  const toy = {
    kind, el, room:ri, x:R(ta+60, tb-60), y:y0,
    vx:(Math.random()-0.5)*180, vy:kind==='ball'?-220:0,
    born:performance.now(), life:kind==='ball'?17:14, touched:new Set(), t:0
  };
  el.className = 'toy '+(kind==='ball'?'ball':'');
  if (kind==='mouse')   el.textContent = '🐭';
  if (kind==='feather') el.textContent = '🪶';
  cafe.appendChild(el);
  S.toys.push(toy);
  G.cats.forEach(c=>{ if (roomIx(c) === ri) excite(c,toy); });
  const where = ROOMS.length>1 ? (ri===0 ? ' (café side)' : ' (nap room)') : '';
  toast((kind==='ball'?'⚽ Ball in play!':kind==='mouse'?'🐭 The mouse toy is loose!':'🪶 Feather wand — jump for it!')+where);
}
function removeToy(toy){
  toy.el.remove();
  S.toys = S.toys.filter(t=>t!==toy);
  G.cats.forEach(c=>{
    if (c.toy===toy){ c.toy=null; if (c.state==='chase'){ c.state='idle'; c.wait=R(.5,2);} }
    if (toy.touched.has(c.id)){                     /* that was fun */
      c.happy = clamp(c.happy + 10, 0, 100);
      c.bond  = clamp(c.bond + 2, 0, 100);
      cheer(c, 20); floatCat(c, '😻');
    }
  });
  const n = toy.touched.size;
  if (n >= 4) addHearts(3, 'the whole café played!');
  else if (n >= 2) addHearts(2, 'playtime');
  else if (n >= 1) addHearts(1, 'playtime');
}
function moveToys(dt){
  const floorY = S.floorBot - 6;
  S.toys.forEach(toy=>{
    toy.t += dt;
    if (toy.kind==='ball'){
      toy.vy += 620*dt;
      toy.x += toy.vx*dt; toy.y += toy.vy*dt;
      const [ba,bb] = roomBounds(Math.max(toy.y, S.backY), toy.room);
      if (toy.x<ba+14){ toy.x=ba+14; toy.vx=Math.abs(toy.vx)*0.8; }
      if (toy.x>bb-14){ toy.x=bb-14; toy.vx=-Math.abs(toy.vx)*0.8; }
      if (toy.y>floorY){ toy.y=floorY; toy.vy=-Math.abs(toy.vy)*0.72; toy.vx*=0.97; if (Math.abs(toy.vy)<40) toy.vy=0; }
      if (toy.y<0){ toy.y=0; toy.vy=Math.abs(toy.vy)*0.5; }
    } else if (toy.kind==='mouse'){
      toy.x += toy.vx*dt*0.55;
      const [ma,mb] = roomBounds(toy.y, toy.room);
      if (toy.x<ma+20 || toy.x>mb-20){ toy.vx*=-1; toy.x=clamp(toy.x,ma+20,mb-20); }
      if (chance(0.02)) toy.vx = (Math.random()-0.5)*260;
      toy.y = clamp(toy.y + Math.sin(toy.t*2)*0.6, S.floorTop+6, S.floorBot-4);
    } else { /* feather */
      toy.x += Math.cos(toy.t*1.1)*70*dt;
      toy.y = S.floorTop + (S.floorBot-S.floorTop)*0.35 + Math.sin(toy.t*2.6)*38;
      const [fa,fb] = roomBounds(toy.y, toy.room);
      toy.x = clamp(toy.x, fa+30, fb-30);
    }
    toy.el.style.left = (toy.x-13)+'px';
    toy.el.style.top  = (toy.y-13)+'px';
    toy.el.style.zIndex = catZ(Math.max(toy.y, S.backY)) + 2;

    /* cats chase */
    G.cats.forEach(c=>{
      if (c.toy!==toy || c.state!=='chase') return;
      c.tx = toy.x + (c.chaseOff||0);
      c.ty = clamp((toy.kind==='feather' ? S.floorTop+(S.floorBot-S.floorTop)*0.6 : toy.y) + (c.chaseDepth||0), S.floorTop, S.floorBot);
      const d = Math.hypot(toy.x-c.x, toy.y-c.y);
      /* pounce: crouch, spring, land on it */
      if (!c.jump && chance(0.035) && d > 34 && d < 150){
        const [ba,bb] = floorBounds(c.y, roomIx(c));
        if (toy.kind==='feather'){
          startJump(c, clamp(c.x + (toy.x>c.x?26:-26), ba+40, bb-40), c.y, {h:52, dur:.46, crouch:.18});
        } else {
          startJump(c, clamp(toy.x, ba+40, bb-40), clamp(Math.max(toy.y, S.backY+8), S.backY+8, S.frontY),
                    {h:30, dur:.40, crouch:.14});
        }
        return;
      }
      if (d < 52 && chance(0.10)){
        toy.touched.add(c.id);
        c.happy = clamp(c.happy + (has(c,'hunter')?11:8), 0, 100);
        c.bond  = clamp(c.bond + 1.6, 0, 100);
        c.energy= clamp(c.energy - 1.4, 0, 100);
        c.plays++; cheer(c, 16);
        floatCat(c, pick(['💫','😸','🐾']));
        if (toy.kind==='ball'){ toy.vx = (c.x<toy.x?1:-1)*R(120,260); toy.vy = -R(180,320); }
        if (toy.kind==='mouse'){ toy.vx = (c.x<toy.x?1:-1)*R(160,280); }
        if (has(c,'hunter') && chance(.2)) floatCat(c,'🎯',200);
      }
    });
    if (toy.t > toy.life) removeToy(toy);
  });

  /* laser pointer */
  if (S.laser){
    if (performance.now() > S.laserUntil) stopLaser();
    else {
      G.cats.forEach(c=>{
        if (c.state==='eat' || c.state==='sleep') return;
        if (c.state!=='chase') return;
        if (roomIx(c) !== S.laser.room) return;
        c.tx = S.laser.x + (c.chaseOff||0)*0.6;
        c.ty = clamp(S.laser.y + (c.chaseDepth||0), S.floorTop, S.floorBot);
        if (Math.hypot(S.laser.x-c.x, S.laser.y-c.y) < 48 && chance(0.05)){
          S.laserTouched.add(c.id);
          c.happy = clamp(c.happy+7,0,100); c.bond = clamp(c.bond+1.1,0,100);
          c.energy = clamp(c.energy-1,0,100); c.plays++; cheer(c, 16);
          floatCat(c, pick(['💥','😼','🐾']));
        }
      });
    }
  }
}
const roomAtX = x => { for (const R of ROOMS) if (x >= R.x0 && x <= R.x1) return R.i; return 0; };
function startLaser(){
  if (S.laser) return;
  S.laser = {x:S.W/2, y:S.floorTop+40, room:busiestRoom()};
  S.laser.x = (ROOMS[S.laser.room].x0 + ROOMS[S.laser.room].x1)/2;
  S.laserTouched = new Set();
  S.laserUntil = performance.now()+14000;
  $('laserDot').style.display='block';
  cafe.classList.add('laser-on');
  G.cats.forEach(c=>{ if (roomIx(c) === S.laser.room) excite(c,null); });
  toast('🔦 Move the pointer — the cats will chase it!');
}
function stopLaser(){
  if (!S.laser) return;
  S.laser = null;
  $('laserDot').style.display='none';
  cafe.classList.remove('laser-on');
  G.cats.forEach(c=>{ if (c.state==='chase'){ c.state='idle'; c.wait=R(.4,2); } });
  const n = S.laserTouched ? S.laserTouched.size : 0;
  if (S.laserTouched) G.cats.forEach(c=>{
    if (S.laserTouched.has(c.id)){
      c.happy = clamp(c.happy + 10, 0, 100); c.bond = clamp(c.bond + 2, 0, 100);
      cheer(c, 20); floatCat(c, '😻');
    }
  });
  if (n>=4) addHearts(3,'laser frenzy!'); else if (n>=2) addHearts(2,'laser play'); else if (n>=1) addHearts(1,'laser play');
  S.laserTouched = null;
}
cafe.addEventListener('pointermove', ev=>{
  if (!S.laser) return;
  ev.preventDefault();
  const r = cafe.getBoundingClientRect();
  S.laser.x = ev.clientX-r.left; S.laser.y = clamp(ev.clientY-r.top, S.floorTop-30, S.floorBot);
  const nr = roomAtX(S.laser.x);
  if (nr !== S.laser.room){ S.laser.room = nr; G.cats.forEach(c=>{ if (roomIx(c)===nr) excite(c,null); }); }
  const d = $('laserDot');
  d.style.left = (S.laser.x-7)+'px'; d.style.top = (S.laser.y-7)+'px';
});

/* ============================================================
   12b. BUTTERFLIES AND MICE — they wander in on their own
   ============================================================ */
const WING_COLOURS = [['#f0c85a','#e8a33c'], ['#e8899f','#d4667f'], ['#9fd7ea','#6fb4d0'],
                      ['#f2f0e6','#d8d2c0'], ['#c9a0e0','#a878c8']];

function spawnCritter(kind){
  if (S.critters.length >= 2) return;
  const ri = busiestRoom();
  const el = document.createElement('div');
  el.className = 'critter ' + kind;
  const y0 = kind === 'butterfly'
    ? S.backY + (S.frontY-S.backY)*R(0.15,0.55)
    : S.backY + (S.frontY-S.backY)*R(0.45,0.92);
  const [ba,bb] = roomBounds(y0, ri);
  const fromLeft = chance(.5);
  if (kind === 'butterfly'){
    const w = pick(WING_COLOURS);
    el.innerHTML =
      '<svg width="36" height="30" viewBox="0 0 36 30">'+
        '<g class="wingL">'+
          '<ellipse cx="10" cy="10" rx="8.5" ry="7.5" fill="'+w[0]+'"/>'+
          '<ellipse cx="12" cy="20" rx="6" ry="6"   fill="'+w[1]+'"/>'+
          '<circle cx="8" cy="9" r="2" fill="#fff" opacity=".45"/>'+
        '</g>'+
        '<g class="wingR">'+
          '<ellipse cx="26" cy="10" rx="8.5" ry="7.5" fill="'+w[0]+'"/>'+
          '<ellipse cx="24" cy="20" rx="6" ry="6"   fill="'+w[1]+'"/>'+
          '<circle cx="28" cy="9" r="2" fill="#fff" opacity=".45"/>'+
        '</g>'+
        '<ellipse cx="18" cy="15" rx="2" ry="9" fill="#4a3b2c"/>'+
        '<circle cx="18" cy="6.5" r="2.4" fill="#4a3b2c"/>'+
        '<path d="M17,5 C15,1 13,1 12.5,2.5" stroke="#4a3b2c" stroke-width="1" fill="none" stroke-linecap="round"/>'+
        '<path d="M19,5 C21,1 23,1 23.5,2.5" stroke="#4a3b2c" stroke-width="1" fill="none" stroke-linecap="round"/>'+
      '</svg>';
  } else {
    el.innerHTML = '<div class="body"></div><div class="ear"></div><div class="tail"></div>';
  }
  cafe.appendChild(el);
  const cr = {
    kind, el, room:ri, life: kind==='butterfly' ? R(26,44) : R(16,26), t:0,
    x: fromLeft ? ba+20 : bb-20, y: y0,
    tx: R(ba+50, bb-50), ty: y0, spd: kind==='butterfly' ? R(26,44) : R(58,92),
    wob: R(0,6.28), leaving:false, touched:new Set()
  };
  S.critters.push(cr);
  /* only the cats who happen to notice */
  G.cats.forEach(c=>{
    if (roomIx(c) !== ri) return;
    const keen = c.traits.playful/12 + (has(c,'hunter')?0.35:0) - (has(c,'lazy')?0.25:0);
    if (chance(clamp(keen, 0.10, 0.8))) exciteCritter(c, cr);
  });
}
function exciteCritter(c, cr){
  if (c.state==='eat' || c.jump || c.state==='jumping' || c.mission) return;
  if (c.state==='sleep' || c.state==='lounge'){ if (chance(.35)) wake(c, true); else return; }
  if (c.spot) leaveSpot(c);
  c.nibble = null; c.watch = null; c.watchAt = null;
  c.critter = cr; c.state = 'chase';
  c.chaseOff = R(-40,40); c.chaseDepth = R(-14,16);
  c.travel = 0; c.bestD = Infinity;
}
function dropCritter(cr){
  cr.el.remove();
  S.critters = S.critters.filter(x=>x!==cr);
  G.cats.forEach(c=>{
    if (c.critter === cr){
      c.critter = null;
      if (c.state==='chase'){ c.state='idle'; c.wait=R(.6,2.4); }
      if (cr.touched.has(c.id)){ c.happy = clamp(c.happy+7,0,100); cheer(c, 16); floatCat(c,'😸'); }
    }
  });
}
function moveCritters(dt){
  S.critters.forEach(cr=>{
    cr.t += dt;
    if (!cr.leaving && cr.t > cr.life) cr.leaving = true;

    if (cr.leaving){
      /* butterflies drift up and out, mice slip away along the floor */
      if (cr.kind === 'butterfly'){ cr.y -= 42*dt; cr.x += Math.sin(cr.t*1.6)*24*dt; }
      else { cr.x += (cr.x < S.W/2 ? -1 : 1) * 120*dt; }
      if (cr.y < S.backY - 60 || cr.x < -40 || cr.x > S.W+40){ dropCritter(cr); return; }
    } else {
      const dx = cr.tx - cr.x, dy = cr.ty - cr.y, d = Math.hypot(dx,dy) || 1;
      if (d < 14){
        const [ba,bb] = roomBounds(cr.y, cr.room);
        cr.tx = R(ba+40, bb-40);
        cr.ty = cr.kind === 'butterfly'
          ? clamp(cr.y + R(-70,70), S.backY+10, S.frontY-40)
          : clamp(cr.y + R(-40,40), S.backY+20, S.frontY-6);
        cr.spd = cr.kind === 'butterfly' ? R(24,48) : R(52,104);
      } else {
        cr.x += (dx/d)*cr.spd*dt;
        cr.y += (dy/d)*cr.spd*dt;
      }
      cr.wob += dt*(cr.kind==='butterfly' ? 3.4 : 7);
    }
    const bobY = cr.kind==='butterfly' ? Math.sin(cr.wob)*9 : Math.sin(cr.wob)*1.5;
    const s = depthScale(clamp(cr.y, S.backY, S.frontY)) * (cr.kind==='butterfly' ? 1 : .95);
    const halfW = cr.kind==='butterfly' ? 18 : 14, halfH = cr.kind==='butterfly' ? 15 : 8;
    cr.el.style.transform = 'translate('+(cr.x-halfW).toFixed(1)+'px,'+(cr.y+bobY-halfH).toFixed(1)+'px) scale('+s.toFixed(2)+')';
    cr.el.style.zIndex = catZ(clamp(cr.y, S.backY, S.frontY)) + 3;

    /* the cats that are following it */
    G.cats.forEach(c=>{
      if (c.critter !== cr || c.state !== 'chase') return;
      c.tx = cr.x + (c.chaseOff||0);
      c.ty = clamp(cr.kind==='butterfly' ? cr.y + 46 : cr.y, S.backY+8, S.frontY);
      const dd = Math.hypot(cr.x-c.x, (cr.y-c.y)*0.7);
      if (!c.jump && cr.kind==='butterfly' && dd < 90 && chance(0.02)){
        const [ba,bb] = floorBounds(c.y, roomIx(c));
        startJump(c, clamp(cr.x, ba+40, bb-40), c.y, {h:58, dur:.5, crouch:.18});   /* a hopeful swipe */
        cr.touched.add(c.id);
        c.happy = clamp(c.happy+4,0,100); c.plays++;
        floatCat(c, pick(['💫','😺']));
      } else if (dd < 44 && chance(0.05)){
        cr.touched.add(c.id);
        c.happy = clamp(c.happy+4,0,100); c.bond = clamp(c.bond+0.6,0,100); c.plays++;
        floatCat(c, pick(['💫','🐾','😸']));
        /* it darts away again */
        const [ba,bb] = roomBounds(cr.y, cr.room);
        cr.tx = clamp(cr.x + (chance(.5)?-1:1)*R(120,240), ba+40, bb-40);
        cr.spd *= 1.5;
      }
    });
  });
}

function petCat(id){
  const c = G.cats.find(x=>x.id===id); if (!c) return;
  if (c.state==='sleep' && chance(.5)) wake(c);
  const lift = (has(c,'cuddly')?13:9) + (c.happy < 35 ? 7 : 0);   /* a glum cat needs it most */
  c.happy = clamp(c.happy + lift,0,100);
  c.bond  = clamp(c.bond + (has(c,'cuddly')?5:2.5),0,100);

/* a name from one of the lists tells us which it is — "Oskar" is a boy, "Luna" a girl */
function genderForName(name){
  const first = String(name||'').trim().split(/\s+/)[0].toLowerCase();
  if (!first) return null;
  if (NAMES_M.some(n=>n.toLowerCase() === first)) return 'M';
  if (NAMES_F.some(n=>n.toLowerCase() === first)) return 'F';
  return null;
}
function flipGender(id){

function renameCat(id){
  const c = G.cats.find(x=>x.id===id); if (!c) return;

  span.outerHTML = '<input id="specName" class="field" style="width:180px;padding:6px 10px;font-size:1rem" value="'+c.name.replace(/"/g,'&quot;')+'" maxlength="18"/>';

  const commit = ()=>{
    const v = inp.value.trim().slice(0,18) || c.name;

  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') openSpec(c.id); });

}

const breedReady = c => !isKitten(c) && c.happy >= 60 && c.hunger >= 45;
function breedWhy(c){
  if (isKitten(c)) return 'too young';
  if (c.hunger < 45) return 'too hungry';

function openBreed(){
  const sel = S.breedSel.map(id=>G.cats.find(c=>c.id===id)).filter(Boolean);
  const slot = i => {
    const c = sel[i];
    if (!c) return '<div class="breed-slot"><div style="font-size:2rem">＋</div><div class="bs-empty">choose a '+(i?'partner':'cat')+'</div></div>';
    return '<div class="breed-slot filled" onclick="toggleBreed(\''+c.id+'\')">'+catSVG(c,110)+

  };
  const pool = G.cats.map(c=>{
    const ok = breedReady(c) && !S.breedSel.includes(c.id) &&
      (!sel.length || sel.some(s=>s.gender!==c.gender)) && S.breedSel.length<2;
    return '<div class="pcard'+(ok?'':' dim')+'" '+(ok?'onclick="toggleBreed(\''+c.id+'\')"':'')+'>'+
      catSVG(c, 58)+'<div class="pc-n">'+c.name+' '+(c.gender==='F'?'♀':'♂')+'</div>'+
      '<div class="pc-s">'+breedWhy(c)+'</div></div>';
  }).join('');
  const canBreed = sel.length===2 && sel[0].gender!==sel[1].gender && G.hearts>=BREED_COST && G.cats.length<MAX_CATS;
  let msg = '';
  if (G.cats.length>=MAX_CATS) msg = 'The café is full ('+MAX_CATS+' cats).';
  else if (G.hearts < BREED_COST) msg = 'You need '+(BREED_COST-G.hearts)+' more 💗 — feed the cats on time and play with them.';
  else if (sel.length<2) msg = 'Pick one ♀ and one ♂ cat, both happy and well fed.';
  else if (sel[0].gender===sel[1].gender) msg = 'Breeding needs one ♀ and one ♂.';
  else msg = 'Ready! The kitten will inherit their coat and one perk from each parent.';
  $('breedModal').innerHTML =
    '<div class="m-head"><div><div class="m-title">💞 Breeding Room</div>'+
      '<div class="m-sub">Costs '+BREED_COST+' 💗 · you have '+G.hearts+' 💗</div></div>'+
      '<button class="m-x" onclick="closeAll()">✕</button></div>'+
    '<div class="m-body">'+
      '<div class="breed-row">'+slot(0)+'<div class="breed-heart">💗</div>'+slot(1)+'</div>'+
      '<p class="note" style="text-align:center;margin:16px 0 4px">'+msg+'</p>'+
      '<div class="sect"><div class="sect-h">Choose parents</div><div class="picker">'+pool+'</div></div>'+
    '</div>'+
    '<div class="m-foot"><button class="act meal" '+(canBreed?'':'disabled')+' onclick="doBreed()">💞 Breed ('+BREED_COST+' 💗)</button>'+
      '<button class="act" style="margin-left:auto" onclick="closeAll()">Close</button></div>';
  $('breedScrim').classList.add('open');
}
function toggleBreed(id){
  const i = S.breedSel.indexOf(id);
  if (i>=0) S.breedSel.splice(i,1);
  else if (S.breedSel.length<2) S.breedSel.push(id);
  openBreed();
}
function doBreed(){
  const [a,b] = S.breedSel.map(id=>G.cats.find(c=>c.id===id));
  if (!a||!b||G.hearts<BREED_COST) return;
  G.hearts -= BREED_COST;
  const kit = breedCats(a,b);
  G.cats.push(kit); G.totalKittens++;
  checkExpansion();
  const p = randomFloorSpot(kit); kit.x = p.x; kit.y = p.y; kit.tx = p.x; kit.ty = p.y;
  mountCat(kit);
  a.happy = clamp(a.happy+10,0,100); b.happy = clamp(b.happy+10,0,100);
  S.breedSel = [];
  $('breedModal').innerHTML =
    '<div class="m-head"><div class="m-title">🎉 A kitten is born!</div><button class="m-x" onclick="closeAll()">✕</button></div>'+
    '<div class="m-body newborn">'+

      '<p class="note" style="margin:12px 0">'+a.name+' × '+b.name+' → a '+(kit.gender==='F'?'girl':'boy')+' · '+kit.coat.breed+'</p>'+
      '<div class="chips" style="justify-content:center">'+kit.perks.map(p=>'<div class="chip" title="'+PERKS[p].d+'">'+PERKS[p].i+' '+PERKS[p].n+'</div>').join('')+'</div>'+
      '<div style="max-width:280px;margin:18px auto 0">'+
        '<div class="sect-h">Name your kitten</div>'+
        '<input id="kitName" class="field" value="'+kit.name+'" maxlength="18"/></div>'+
    '</div>'+
    '<div class="m-foot"><button class="act meal" style="margin:0 auto" onclick="nameKitten(\''+kit.id+'\')">Welcome to the café 🐾</button></div>';
  setTimeout(()=>{ const i=$('kitName'); if(i){i.focus();i.select();} }, 60);
  floatCat(kit,'✨'); floatCat(kit,'🎉',260);
  toast('🎉 '+a.name+' and '+b.name+' have a kitten!','reward');
  updateTopbar(); save();
}

   ============================================================ */
let RESETTING = false;
function save(){
  if (RESETTING) return;
  try{
    const data = {
      v:1, t:G.t, hearts:G.hearts, speed:G.speed, roomsOpen:G.roomsOpen, namesChecked:true,
      lastDay:G.lastDay, totalKittens:G.totalKittens, uid:UID, savedAt:Date.now(),
      cats:G.cats.map(c=>({
        id:c.id,name:c.name,gender:c.gender,coat:c.coat,perks:c.perks,born:c.born,
        parents:c.parents,traits:c.traits,temper:c.temper,pace:c.pace,room:c.room,
        hunger:c.hunger,happy:c.happy,energy:c.energy,bond:c.bond,
        meals:c.meals,pets:c.pets,plays:c.plays
      }))
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  }catch(e){}
}
function load(){
  let d; try{ d = JSON.parse(localStorage.getItem(SAVE_KEY)||'null'); }catch(e){ d=null; }
  if (!d){                                   /* a café saved under the old name */
    for (const k of OLD_SAVE_KEYS){
      try{ const old = JSON.parse(localStorage.getItem(k)||'null'); if (old){ d = old; break; } }catch(e){}
    }
  }
  if (!d || !d.cats || !d.cats.length) return false;
  G.t = d.t; G.hearts = d.hearts||0; G.speed = d.speed||1;
  G.lastDay = d.lastDay||day(); G.totalKittens = d.totalKittens||0; UID = d.uid||100;
  G.roomsOpen = clamp(d.roomsOpen||1, 1, MAX_ROOMS);
  G.namesChecked = !!d.namesChecked;
  G.cats = d.cats.map(s=>{
    const c = Object.assign(makeCat(null,{name:s.name,gender:s.gender,coat:s.coat,perks:s.perks,born:s.born}), s);
    c.state='idle'; c.wait=R(0,3); c.dir=chance(.5)?1:-1; c.spot=null; c.el=null; c.toy=null; c.bowl=null;
    c.room = clamp(s.room||0, 0, MAX_ROOMS-1); c.crossTo = null;
    c.grown = !isKitten(c);
    return c;
  });
  /* offline drift — capped at 6 café hours */
  const away = clamp((Date.now()-(d.savedAt||Date.now()))/1000, 0, 360);
  if (away > 60){
    G.t += away;
    G.cats.forEach(c=>{
      c.hunger = clamp(c.hunger - 0.14*away,0,100);
      c.happy  = clamp(c.happy  - 0.05*away,0,100);
      c.energy = clamp(c.energy + 0.10*away,0,100);
    });
    setTimeout(()=>toast('😺 The cats carried on without you. Welcome back.'), 900);
  }
  /* one-off tidy-up: a cat called Oskar is a boy, one called Luna is a girl */
  if (!G.namesChecked){
    G.namesChecked = true;
    G.cats.forEach(c=>{ const g = genderForName(c.name); if (g) c.gender = g; });
  }
  G.lastDay = day();
  return true;
}
let resetArmed = 0;
function hardReset(ev){
  const btn = ev && ev.currentTarget;
  if (Date.now() > resetArmed){
    resetArmed = Date.now()+6000;
    if (btn) btn.textContent = '↺ Tap again to confirm';
    setTimeout(()=>{ if (btn && Date.now()>resetArmed) btn.textContent = '↺ Start a new café'; }, 6200);
    return;
  }
  RESETTING = true;
  localStorage.removeItem(SAVE_KEY);
  OLD_SAVE_KEYS.forEach(k=>localStorage.removeItem(k));
  location.reload();
}

/* ============================================================
   18b. OPENING THE ROOM NEXT DOOR
   ============================================================ */
function openNextRoom(){
  if (G.roomsOpen >= MAX_ROOMS) return false;
  G.roomsOpen++;
  layout();
  const to = ROOMS.length-1;
  /* send a good share of the cats through so the new room is not empty */
  const movers = G.cats.filter(c=>!c.spot);
  for (let i=movers.length-1;i>0;i--){ const j=RI(0,i), t=movers[i]; movers[i]=movers[j]; movers[j]=t; }
  movers.slice(0, Math.round(G.cats.length*0.45)).forEach(c=>{
    c.room = to; c.crossTo = null; c.state='idle'; c.wait = R(0,8); c.jump = null;
    const p = randomFloorSpot(c);
    c.x = p.x; c.y = p.y; c.tx = p.x; c.ty = p.y;
    clampFloor(c); drawCat(c);
  });
  toast('🚪 The café has taken the room next door — the nap room is open!');
  setTimeout(()=>toast('🐾 The two rooms share a doorway; cats wander between them.'), 2600);
  save();
  return true;
}
function checkExpansion(){
  if (G.cats.length > ROOM_AT && G.roomsOpen < MAX_ROOMS) openNextRoom();
}

/* ============================================================
   19. INIT
   ============================================================ */
function placeCat(c){
  if (c.room === undefined || c.room >= ROOMS.length) c.room = 0;
  const p = randomFloorSpot(c);
  c.x = p.x; c.y = p.y; c.tx = p.x; c.ty = p.y;
  /* nobody starts in step with anybody else */
  c.wait = R(0, 18);
  c.state = 'idle';
  if (chance(0.35)){
    const q = randomFloorSpot(c);
    c.tx = q.x; c.ty = q.y; c.state = 'walk';
  }
}
function init(){
  layout();
  if (!load()){
    /* the founding ten: every cat a different coat */
    const pool = COATS.slice();
    for (let i=0;i<START_CATS;i++){
      const base = pool.length ? pool.splice(RI(0,pool.length-1),1)[0] : pick(COATS);
      const coat = Object.assign({}, base);
      if (chance(.3)) coat.eye = pick(EYES);
      /* guarantee at least one of each gender so breeding is possible from day one */
      const gender = i===0 ? 'F' : i===1 ? 'M' : undefined;
      G.cats.push(makeCat(G, {coat, gender}));
    }
    G.t = 8*60; G.lastDay = 1;
  }
  layout();                       /* the save may have a second room open */
  G.cats.forEach(c=>{ placeCat(c); mountCat(c); });
  layout();
  checkExpansion();
  assignHomes();
  S.bowls.filter(b=>!b.personal).forEach(b=>{      /* the bowls are already filled */
    b.food = 3; b.kind='meal'; b.el.classList.add('full');
  });
  updateTopbar();
  advanceClock();
  setInterval(save, 15000);
  window.addEventListener('beforeunload', save);
  simLast = performance.now();
  setInterval(simLoop, 200);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ lastFrame = performance.now(); } });
  requestAnimationFrame(t=>{ lastFrame=t; frame(t); });
  setTimeout(()=>toast('☕ Welcome in — '+G.cats.length+' cats, no hurry'), 500);
}

/* touch devices get the bowl button on the cat they have tapped */
if (window.matchMedia('(hover: none)').matches || 'ontouchstart' in window){
  document.body.classList.add('touch');
}
/* tapping a cat selects it, so its bowl button is within reach */
cafe.addEventListener('pointerdown', ev=>{
  const el = ev.target.closest('.cat');
  if (!el) return;
  G.cats.forEach(c=>c.el && c.el.classList.toggle('selected', c.el === el));
}, true);

/* buttons */
$('feedBtn').onclick    = serveMeal;
$('treatBtn').onclick   = giveTreat;
$('ballBtn').onclick    = ()=>spawnToy('ball');
$('mouseBtn').onclick   = ()=>spawnToy('mouse');
$('featherBtn').onclick = ()=>spawnToy('feather');
$('laserBtn').onclick   = ()=>{ S.laser ? stopLaser() : startLaser(); };
$('rosterBtn').onclick  = openRoster;
$('breedBtn').onclick   = ()=>{ S.breedSel=[]; openBreed(); };
$('helpBtn').onclick    = openHelp;
$('speedBtn').onclick   = ()=>{ G.speed = G.speed===1?3:1; updateTopbar(); };
cafe.addEventListener('click', ()=>{ if (S.laser) return; });

init();
</script>
