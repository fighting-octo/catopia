  if (lp){
    S.litters.push({room:i, x:lp.x, y:lp.y, scale:depthScale(lp.y)});
    if (lfront){                                    /* the near rim sits over the cat */
      lfront.style.left = lbox.style.left; lfront.style.top = lbox.style.top;
      lfront.style.transformOrigin = '50% 100%'; lfront.style.transform = lbox.style.transform;
      lfront.style.zIndex = catZ(lp.y) + 2;
    }
  }
  const chair = q('.armchair');
  const chairP = put(chair, 0.72, 0.94, 224, 198);
  if (chair && chairP){
    /* turned 30° to the right, about its own upright axis */
    chair.style.transformOrigin = '50% 100%';
    chair.style.transform = 'perspective(760px) rotateY(30deg)' + (k < 0.999 ? ' scale('+k.toFixed(3)+')' : '');
    S.chairs = S.chairs.filter(ch=>ch.room !== i);
    S.chairs.push({room:i, x:chairP.x, y:chairP.y, scale:depthScale(chairP.y)});
  }

  /* ---- the aquarium along the left wall ---- */
  const tankEl = q('.walltank');
  if (tankEl && hasTank(i)){
    let tank = S.tanks.find(t=>t.room===i);
    if (!tank){ tank = {room:i, fish:[], bubbles:[], built:false}; S.tanks.push(tank); }
    tank.el = tankEl;
    buildWallTank(tank, R);
  } else if (tankEl){
    tankEl.style.display = 'none';
  }

  /* the dining mat, drawn in perspective */
  const dm = q('.r-diner');
  if (dm){
    const pts = [floorX(0.34,0.045,i), floorX(0.34,0.905,i), floorX(0.55,0.955,i), floorX(0.55,-0.01,i)];
    const minX = Math.min(...pts.map(p=>p.x)), maxX = Math.max(...pts.map(p=>p.x));
    const minY = Math.min(...pts.map(p=>p.y)), maxY = Math.max(...pts.map(p=>p.y));
    dm.style.left = (minX - R.x0)+'px'; dm.style.top = minY+'px';
    dm.style.width = (maxX-minX)+'px'; dm.style.height = (maxY-minY)+'px';
    dm.style.clipPath = 'polygon('+pts.map(p=>(p.x-minX).toFixed(1)+'px '+(p.y-minY).toFixed(1)+'px').join(',')+')';
    dm.style.zIndex = 5;
  }

  /* ---- food bowls, in a row on the mat ---- */
  let bowls = S.bowls.filter(b=>!b.personal && b.room===i);
  while (bowls.length < 5){
    const el2 = document.createElement('div');
    el2.className = 'bowl';
    el2.innerHTML = bowlHTML();
    cafe.appendChild(el2);
    const b = {el:el2, food:0, kind:'meal', treat:false, taken:null, x:0, y:0, room:i};
    S.bowls.push(b); bowls.push(b);
  }
  bowls.forEach((b,k)=>{
    const p = floorX(0.40 + (k%2)*0.10, 0.08 + k*0.195, i);
    b.x = p.x; b.y = p.y;
    const s = depthScale(b.y);
    b.el.style.width = (60*s)+'px'; b.el.style.height = (34*s)+'px';
    b.el.style.left = (b.x - 30*s)+'px';
    b.el.style.top  = (b.y - 34*s)+'px';
    b.el.style.zIndex = catZ(b.y)+1;
  });

  /* ---- baskets & cushions ---- */
  let beds = S.beds.filter(b=>b.room===i);
  if (!beds.length){
    BED_SPEC.forEach(spec=>{
      const bed = {kind:spec.kind, spec, els:{}, room:i};
      if (spec.kind==='basket'){
        bed.els.back  = document.createElement('div'); bed.els.back.className='bk-back';
        bed.els.in    = document.createElement('div'); bed.els.in.className='bk-in';
        bed.els.front = document.createElement('div'); bed.els.front.className='bk-front';
        cafe.appendChild(bed.els.back); cafe.appendChild(bed.els.in); cafe.appendChild(bed.els.front);
      } else {
        bed.els.back = document.createElement('div'); bed.els.back.className='bk-cush';
        cafe.appendChild(bed.els.back);
      }
      S.beds.push(bed); beds.push(bed);
    });
  }
  beds.forEach(bed=>{
    const p = floorX(bed.spec.t, bed.spec.fx, i);
    const s = depthScale(p.y);
    bed.x = p.x; bed.y = p.y; bed.scale = s;
    const w = (bed.kind==='basket' ? 104 : 92) * s, h = (bed.kind==='basket' ? 40 : 30) * s;
    const z = catZ(p.y);
    const set = (elm, ww, hh, dx, dy, zz) => {
      elm.style.width=ww+'px'; elm.style.height=hh+'px';
      elm.style.left=(p.x-ww/2+dx)+'px'; elm.style.top=(p.y-hh+dy)+'px'; elm.style.zIndex=zz;
    };
    set(bed.els.back, w, h, 0, 0, z-2);
    if (bed.kind==='basket'){
      set(bed.els.in, w*0.82, h*0.72, 0, -h*0.16, z-1);
      set(bed.els.front, w*0.98, h*0.5, 0, 0, z+2);
    }
  });

  /* ---- cat grass pots ---- */
  let grass = S.grass.filter(g=>g.room===i);
  if (!grass.length){
    GRASS_SPEC.forEach(spec=>{
      const el2 = document.createElement('div');
      el2.className = 'grass';
      cafe.appendChild(el2);
      const g = {el:el2, spec, room:i};
      S.grass.push(g); grass.push(g);
    });
  }
  grass.forEach(g=>{
    const p = floorX(g.spec.t, g.spec.fx, i);
    const s = depthScale(p.y);
    const w = Math.round(58*s);
    g.x = p.x; g.y = p.y; g.scale = s;
    g.el.innerHTML = grassSVG(w);
    g.el.style.left = (p.x - w/2)+'px';
    g.el.style.top  = (p.y - w*1.15)+'px';
    g.el.style.zIndex = catZ(p.y) - 1;
  });

  /* the jellyfish mural belongs on the café's outer right-hand wall */
  const mural = q('.mural');
  if (mural){
    if (i === ROOMS.length-1){ mural.parentElement.style.display=''; paintMural(mural); }
    else mural.parentElement.style.display = 'none';
  }

  /* posts worth sharpening claws on: the scratching post and the trees */
  S.posts = S.posts.filter(p=>p.room !== i);
  const postAt = (elm, dx) => {
    if (!elm || !elm.offsetParent) return;
    const q = rect(elm);
    S.posts.push({room:i, x:q.x + q.w/2 + (dx||0), y:clamp(q.b, S.backY+12, S.frontY)});
  };
  postAt(q('.r-post'));
  postAt(q('.r-tower'),  -18*k);
  postAt(q('.r-tower2'),  14*k);

  buildSpots(R, rect);
}

/* ---- nap / lounge spots: baskets, cushions, shelves, sill, tower, counter ---- */
function buildSpots(R, rect){
  const i = R.i, el = S.rooms[i].el, q = s => el.querySelector(s);
  const keep = S.spotTaken || {};
  const groundWall = S.backY + (S.frontY-S.backY)*0.13;
  const add = o => { o.room = i; o.taken = keep[o.key] || null; S.spots.push(o); return o; };

  S.chairs.filter(ch=>ch.room===i).forEach((ch,k)=> add({
    key:'r'+i+'chair'+k, kind:'bed', elevated:false,
    x:ch.x - 4*ch.scale, y:ch.y - 56*ch.scale, groundY:ch.y + 6*ch.scale,
    scale:ch.scale*0.98, z:catZ(ch.y)+1, chair:true
  }));
  S.beds.filter(b=>b.room===i).forEach((bed,k)=> add({
    key:'r'+i+'bed'+k, kind:'bed', elevated:false, x:bed.x, y:bed.y - 3*bed.scale,
    groundY:bed.y, scale:bed.scale, z:catZ(bed.y), bed
  }));
  const wall = (elm, frac, dy, key) => {
    if (!elm || !elm.offsetParent) return;
    const p = rect(elm);
    add({key:'r'+i+key, kind:'perch', elevated:true, x:p.x + p.w*frac, y:p.y + (dy||2),
         groundY:groundWall, scale:depthScale(S.backY)*0.92, z:5});
  };
  wall(q('.r-sill'), 0.22, 2, 'sill-a');
  wall(q('.r-sill'), 0.76, 2, 'sill-b');
  wall(q('.sh1'), 0.74, 1, 'sh1');
  wall(q('.sh2'), 0.5,  1, 'sh2');
  const sb = q('.shelfbed');
  if (sb && sb.offsetParent){
    const p = rect(sb);
    add({key:'r'+i+'shelfbed', kind:'perch', elevated:true, x:p.x+p.w/2, y:p.b-4,
         groundY:groundWall, scale:depthScale(S.backY)*0.92, z:5});
  }
  ['.r-tower','.r-tower2'].forEach((sel,ti)=>{
    const tower = q(sel);
    if (!tower || !tower.offsetParent) return;
    const tb = rect(tower);
    [...tower.querySelectorAll('.tw-plat')].forEach((pl,k)=>{
      const p = rect(pl);
      add({key:'r'+i+'tw'+ti+'_'+k, kind:'perch', elevated:true, x:p.x+p.w/2, y:p.y+2,
           groundY:clamp(tb.b, S.backY+10, S.frontY), scale:depthScale(tb.b)*0.88,
           z:catZ(tb.b)+1});
    });
  });
  /* the warm lid of the fish tank — the best seat in the house */
  S.tanks.filter(t=>t.room===i && t.geom).forEach(t=>{
    [0.34, 0.68].forEach((u,k)=>{
      const top = lerpPt(t.geom.A, t.geom.B, u);
      const gy  = t.geom.backY + (t.geom.frontY - t.geom.backY)*u;
      add({key:'r'+i+'tanktop'+k, kind:'perch', elevated:true,
           x: t.geom.minX + top[0], y: t.geom.minY + top[1] - 2,
           groundY: clamp(gy, S.backY+10, S.frontY),
           scale: depthScale(gy)*0.86, z: 8});
    });
  });

  const co = q('.r-counter');
  if (co && co.offsetParent){
    const p = rect(co);
    add({key:'r'+i+'counter', kind:'perch', elevated:true, x:p.x+p.w*0.68, y:p.y-22,
         groundY:clamp(p.b, S.backY+10, S.frontY), scale:depthScale(p.b)*0.9, z:catZ(p.b)+1});
  }
}

/* ---- the wall aquarium: drawn in perspective, with a shoal inside ---- */
const FISH_COLOURS = ['#f2a03c','#e8643c','#f3d05a','#7fd0e8','#e88fb8','#9be07f','#f0f0f0','#c98fe0'];

function buildWallTank(tank, R){
  const el = tank.el, i = tank.i = R.i;

  /* where the wall meets the floor at each end of the tank */
  const wb = floorXRaw(TANK.back,  0, i);              /* back end  */
  const wf = floorXRaw(TANK.front, 0, i);              /* front end */
  const sb = depthScale(wb.y), sf = depthScale(wf.y);

  /* a point on the wall: h above the floor. "out" pushes it off the wall into the room. */
  const wall  = (p, s, h)        => ({x:p.x,                y:p.y - h*s});
  const outed = (p, s, h)        => ({x:p.x + TANK.out*s,   y:p.y - h*s + TANK.outY*s});

  const mB = TANK.mount, mF = TANK.mount, tH = TANK.h;
  const WTb = wall(wb, sb, mB + tH), WBb = wall(wb, sb, mB);     /* wall side, back  */
  const WTf = wall(wf, sf, mF + tH), WBf = wall(wf, sf, mF);     /* wall side, front */
  const FTb = outed(wb, sb, mB + tH), FBb = outed(wb, sb, mB);   /* glass side, back */
  const FTf = outed(wf, sf, mF + tH), FBf = outed(wf, sf, mF);   /* glass side, front*/

  /* the shelf under it, with a little overhang */
  const ov = 10;
  const shelfDrop = TANK.shelf;
  const SWb = wall(wb, sb, mB - 0), SWf = wall(wf, sf, mF - 0);
  const SFb = {x:FBb.x + ov*sb, y:FBb.y + ov*0.5*sb}, SFf = {x:FBf.x + ov*sf, y:FBf.y + ov*0.5*sf};

  /* container box */
  const pts = [WTb,WBb,WTf,WBf,FTb,FBb,FTf,FBf,SWb,SWf,SFb,SFf];
  const minX = Math.min(...pts.map(p=>p.x)) - 10, maxX = Math.max(...pts.map(p=>p.x)) + 14;
  const minY = Math.min(...pts.map(p=>p.y)) - 12, maxY = Math.max(...pts.map(p=>p.y)) + shelfDrop*sf + 34*sf;
  const W = maxX-minX, H = maxY-minY;
  el.style.left = (minX - R.x0)+'px'; el.style.top = minY+'px';
  el.style.width = W+'px'; el.style.height = H+'px';
  el.style.zIndex = 4;                                  /* it hangs on the wall, behind the cats */
  const P = p => [ +(p.x-minX).toFixed(1), +(p.y-minY).toFixed(1) ];

  /* glass face: A back-top, B front-top, C front-bottom, D back-bottom */
  const A = P(FTb), B = P(FTf), C = P(FBf), D = P(FBb);
  /* wall side */
  const E = P(WTb), F = P(WTf), G = P(WBf), Gb = P(WBb);
  /* shelf */
  const s1 = P(SWb), s2 = P(SWf), s3 = P(SFf), s4 = P(SFb);
  const dropF = shelfDrop*sf, dropB = shelfDrop*sb;
  const s3d = [s3[0], s3[1] + dropF], s4d = [s4[0], s4[1] + dropB];
  const s2d = [s2[0], s2[1] + dropF];

  tank.geom = {A, B, C, D, sBack:sb, sFront:sf, minX, minY,
               frontY: wf.y, backY: wb.y, frontX: wf.x, backX: wb.x};

  const poly = ps => ps.map(p=>p[0].toFixed ? p[0].toFixed(1)+','+p[1].toFixed(1) : p[0]+','+p[1]).join(' ');
  const gravelTop = 0.80;
  const gA = lerpPt(A, D, gravelTop), gB2 = lerpPt(B, C, gravelTop);

  let weeds = '';
  [0.10,0.22,0.34,0.47,0.60,0.72,0.84,0.93].forEach((u,k)=>{
    const base = lerpPt(D, C, u), top = lerpPt(A, B, u);
    const s = sb + (sf-sb)*u;
    const hgt = (24 + (k%3)*13) * s, wdt = (6 + (k%2)*3) * s;
    const x = base[0] + (top[0]-base[0])*0.02;
    const y = base[1] - (base[1]-top[1])*0.10;
    weeds += '<rect class="wt-weed" x="'+(x-wdt/2).toFixed(1)+'" y="'+(y-hgt).toFixed(1)+
             '" width="'+wdt.toFixed(1)+'" height="'+hgt.toFixed(1)+
             '" rx="'+(wdt/2).toFixed(1)+'" fill="'+(k%2 ? '#3f9b58' : '#5fbf7a')+'" opacity=".92"/>';
  });

  /* brackets under the shelf */
  let brackets = '';
  [0.26, 0.72].forEach(u=>{
    const a1 = lerpPt(s1, s2, u), a2 = lerpPt(s4d, s3d, u);
    const s = sb + (sf-sb)*u, dr = 26*s;
    brackets += '<polygon points="'+poly([[a1[0], a1[1]+dropB], [a2[0], a2[1]], [a1[0], a1[1]+dropB+dr]])+
                '" fill="#5a3f2e"/>';
  });

  el.innerHTML =
    '<svg width="'+W.toFixed(0)+'" height="'+H.toFixed(0)+'" viewBox="0 0 '+W.toFixed(0)+' '+H.toFixed(0)+'">'+
      '<defs>'+
        '<linearGradient id="wtw'+i+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0" stop-color="#56a7bd"/><stop offset="55%" stop-color="#2f7690"/>'+
          '<stop offset="100%" stop-color="#20566b"/></linearGradient>'+
        '<linearGradient id="wts'+i+'" x1="0" y1="0" x2="0" y2="1">'+
          '<stop offset="0" stop-color="#9a6b4c"/><stop offset="100%" stop-color="#5a3f2e"/></linearGradient>'+
        '<clipPath id="wtc'+i+'"><polygon points="'+poly([A,B,C,D])+'"/></clipPath>'+
      '</defs>'+
      /* soft shadow on the wall behind */
      '<polygon points="'+poly([E,F,G,Gb])+'" fill="#000" opacity=".22"/>'+
      /* the shelf: top surface, then its front edge */
      '<polygon points="'+poly([s1,s2,s3,s4])+'" fill="#a5744d"/>'+
      '<polygon points="'+poly([s4,s3,s3d,s4d])+'" fill="url(#wts'+i+')"/>'+
      '<polygon points="'+poly([s2,s3,s3d,s2d])+'" fill="#4a3226"/>'+
      brackets +
      /* the water, seen through the front glass */
      '<polygon points="'+poly([A,B,C,D])+'" fill="url(#wtw'+i+')"/>'+
      '<g clip-path="url(#wtc'+i+')">'+
        '<polygon points="'+poly([gA,gB2,C,D])+'" fill="#6b5942"/>'+
        '<polygon points="'+poly([gA,gB2,C,D])+'" fill="#8a7455" opacity=".45"/>'+
        weeds +
      '</g>'+
      /* the water surface, running back to the wall */
      '<polygon points="'+poly([A,B,F,E])+'" fill="#2b6b83"/>'+
      '<polygon points="'+poly([A,B,F,E])+'" fill="#cdeef8" opacity=".26"/>'+
      /* the near end of the tank — this is what makes it read as a box */
      '<polygon points="'+poly([F,B,C,G])+'" fill="#2a6076"/>'+

          '" fill="#eaffff" opacity=".10"/>'+
        '<polygon points="'+poly([lerpPt(A,B,0.52), lerpPt(A,B,0.62), lerpPt(D,C,0.58), lerpPt(D,C,0.48)])+
          '" fill="#eaffff" opacity=".07"/>'+
      '</g>'+
      '<polygon points="'+poly([A,B,C,D])+'" fill="none" stroke="#6d5344" stroke-width="'+(3.2*sf).toFixed(1)+'"/>'+
      '<polygon points="'+poly([A,B,F,E])+'" fill="none" stroke="#7a5c48" stroke-width="'+(2.6*sf).toFixed(1)+'"/>'+
      '<polygon points="'+poly([F,B,C,G])+'" fill="none" stroke="#6d5344" stroke-width="'+(2.6*sf).toFixed(1)+'"/>'+
      /* the hood, sitting on top */
      '<polygon points="'+poly([[A[0]-3*sb,A[1]-5*sb],[B[0]+4*sf,B[1]-5*sf],[F[0]+4*sf,F[1]-6*sf],[E[0]-3*sb,E[1]-6*sb]])+
        '" fill="#7a5c48"/>'+

  /* the fish swim inside a layer clipped to the glass, so none can slip out */
  const inner = document.createElement('div');

  el.appendChild(inner);
  tank.inner = inner;

  stockTank(tank);
}
function lerpPt(p, q, u){ return [ +p[0] + (+q[0] - +p[0])*u, +p[1] + (+q[1] - +p[1])*u ]; }
function mixPt(p, q, v){ const r = lerpPt(p, q, v); return [r[0].toFixed(1), r[1].toFixed(1)]; }

/* a point inside the glass: u along the tank (0 back … 1 front), v down (0 top … 1 bottom) */
function tankPoint(tank, u, v){
  const g = tank.geom;
  const top = lerpPt(g.A, g.B, u), bot = lerpPt(g.D, g.C, u);
  const p = lerpPt(top, bot, v);
  return {x:p[0], y:p[1], s:g.sBack + (g.sFront-g.sBack)*u};
}

function stockTank(tank){
  const el = tank.inner || tank.el;
  const want = 13;
  /* the fish and bubbles live on top of the svg, clipped to the glass */
  tank.fish.forEach(f=>el.appendChild(f.el));
  tank.bubbles.forEach(b=>el.appendChild(b.el));
  while (tank.fish.length < want){
    const d = document.createElement('div');
    d.className = 'wt-fish';
    d.style.background = pick(FISH_COLOURS);
    el.appendChild(d);
    tank.fish.push({
      el:d, u:R(0.08,0.92), v:R(0.24,0.74), dir: chance(.5)?1:-1,
      spd:R(0.03,0.085), bob:R(0,6.28), bobA:R(0.012,0.035), bobS:R(0.7,1.7),
      size:R(13,23), turnAt:R(1.5,5)
    });
  }
  while (tank.bubbles.length < 9){
    const d = document.createElement('div');
    d.className = 'wt-bubble';
    el.appendChild(d);
    tank.bubbles.push({el:d, u:R(0.10,0.22), v:1, spd:R(0.30,0.62), size:R(3,6), wob:R(0,6.28)});
  }
}

function moveFish(dt){
  S.tanks.forEach(tank=>{
    if (!tank.geom) return;
    tank.fish.forEach(f=>{
      f.turnAt -= dt;
      if (f.turnAt <= 0){                              /* fish change their minds */
        f.turnAt = R(1.6,6);
        if (chance(.45)) f.dir *= -1;
        f.spd = R(0.03,0.09);
        f.v = clamp(f.v + R(-0.12,0.12), 0.20, 0.76);
      }
      f.u += f.dir * f.spd * dt;
      if (f.u < 0.05){ f.u = 0.05; f.dir = 1; }
      if (f.u > 0.95){ f.u = 0.95; f.dir = -1; }
      f.bob += dt * f.bobS;
      const p = tankPoint(tank, f.u, clamp(f.v + Math.sin(f.bob)*f.bobA, 0.16, 0.80));
      const w = Math.max(7, f.size*p.s), h = Math.max(5, w*0.56);
      f.el.style.width = w.toFixed(1)+'px'; f.el.style.height = h.toFixed(1)+'px';
      f.el.style.left = (p.x - w/2).toFixed(1)+'px';
      f.el.style.top  = (p.y - h/2).toFixed(1)+'px';
      f.el.style.transform = 'scaleX('+(f.dir>0?-1:1)+')';
    });
    tank.bubbles.forEach(b=>{
      b.v -= b.spd*dt;
      if (b.v < 0.12){ b.v = 0.92; b.u = R(0.08,0.24); b.spd = R(0.30,0.62); }
      b.wob += dt*2;
      const p = tankPoint(tank, b.u + Math.sin(b.wob)*0.004, b.v);
      const d = Math.max(2.5, b.size*p.s);
      b.el.style.width = d.toFixed(1)+'px'; b.el.style.height = d.toFixed(1)+'px';
      b.el.style.left = (p.x - d/2).toFixed(1)+'px';
      b.el.style.top  = (p.y - d/2).toFixed(1)+'px';
      b.el.style.opacity = (b.v > 0.8 ? (0.92-b.v)*5 : b.v < 0.25 ? b.v*4 : 1).toFixed(2);
    });
  });
}

/* How busy a patch of floor is. Counts cats that are there and cats on their way there,
   with a soft falloff, so the room fills evenly instead of clumping. */
const CROWD_R2 = 285*285;
function crowdAt(x, y, ri, ignore){
  let s = 0;
  for (let k=0;k<G.cats.length;k++){
    const o = G.cats[k];
    if (o === ignore || roomIx(o) !== ri) continue;
    if (o.spot && (o.state==='sleep' || o.state==='lounge') && o.spot.elevated) continue;
    const dx = o.x - x,  dy = (o.y - y)*2.2;
    s += 1 / (1 + (dx*dx + dy*dy)/CROWD_R2);
    const ex = o.tx - x, ey = (o.ty - y)*2.2;          /* where they are headed counts too */
    s += 0.7 / (1 + (ex*ex + ey*ey)/CROWD_R2);
  }
  return s;
}

/* Give every cat a loose patch of the room to call its own, spread evenly across the
   width. They still wander everywhere, but they drift back to different places, which is
   what stops them all ending up in the same corner. */
function assignHomes(){
  ROOMS.forEach(R=>{
    const here = G.cats.filter(c=>roomIx(c) === R.i);
    if (!here.length) return;
    here.sort((a,b)=>a.x - b.x);
    here.forEach((c,k)=>{
      const want = (k + 0.5) / here.length;
      c.home = (c.home === undefined) ? want : c.home + (want - c.home)*0.5;   /* ease over */
    });
  });
}

/* pick somewhere to be: the emptiest of a handful of candidates */
function randomFloorSpot(c, near){
  const ri = roomIx(c);
  let best = null, bestScore = Infinity;
  const tries = near ? 10 : 22;
  for (let i=0;i<tries;i++){
    let y = near ? clamp(c.y + R(-110,110)*0.6, S.backY+10, S.frontY-4)
                 : R(S.backY+10, S.frontY-4);
    const [a,b] = roomBounds(y, ri);
    const m = 62*depthScale(y), w = (b-m)-(a+m);
    let x = near ? c.x + (chance(.5)?-1:1)*R(70, 230) : R(a+m, b-m);
    if (!near && has(c,'shy'))               x = chance(.5) ? R(a+m, a+m+w*0.26) : R(b-m-w*0.26, b-m);
    if (!near && has(c,'sunbather') && !isNight()) x = R(a+m, a+m+w*0.45);
    x = clamp(x, a+m, b-m);

    let score = crowdAt(x, y, ri, c);
    /* and a hard penalty for standing near ANY single cat, which is what breaks up groups */
    let nearest = Infinity;
    for (let k=0;k<G.cats.length;k++){
      const o = G.cats[k];
      if (o === c || roomIx(o) !== ri) continue;
      if (o.spot && o.spot.elevated && (o.state==='sleep'||o.state==='lounge')) continue;
      nearest = Math.min(nearest, Math.hypot(o.x-x, (o.y-y)*2.2), Math.hypot(o.tx-x, (o.ty-y)*2.2));
    }
    if (nearest < Infinity) score += 340/(90 + nearest);
    /* and a gentle pull back to its own patch of the room */
    if (c.home !== undefined && !near) score += Math.abs((x - a)/Math.max(1,(b - a)) - c.home) * 1.1;
    /* nudge them to actually go somewhere, and to use the whole depth of the room */
    const travel = Math.hypot(x-c.x, (y-c.y)*2.2);
    if (!near) score -= Math.min(travel, 460)/460 * 0.8;
    score += Math.abs(depthT(y) - 0.5) * 0.06;      /* only a slight pull off the very edges */
    if (score < bestScore){ bestScore = score; best = {x,y}; }
  }
  return best || {x:(ROOMS[ri].x0+ROOMS[ri].x1)/2, y:(S.backY+S.frontY)/2};
}

/* walk somewhere, going through the doorway when it is in another room */
function headFor(c, x, y, room, state){
  room = (room === undefined) ? roomIx(c) : clamp(room, 0, ROOMS.length-1);
  if (room !== roomIx(c) && ROOMS.length > 1){
    c.crossTo = room;
    c.finalX = x; c.finalY = y;
    c.tx = doorX(); c.ty = doorY();
  } else {
    c.crossTo = null;
    c.tx = x; c.ty = y;
  }
  if (state) c.state = state;
  c.travel = 0; c.bestD = Infinity;
}
