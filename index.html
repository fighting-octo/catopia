<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>CATopia — Cat Café</title>
<style>
/* ============================================================
   CATOPIA — CAT CAFÉ
   Cat artwork & animation style adapted from fighting-octopus.com
   ============================================================ */

:root{
  --wall-1:#3b2a24;  --wall-2:#523a30;  --wall-3:#2a1d19;
  --wood-1:#7a5236;  --wood-2:#5c3d28;  --wood-3:#93673f;
  --ink:#f0e2d4;     --ink-dim:#c3a68f;  --ink-soft:#9c8271;
  --accent:#e8b661;  --accent-2:#7ab4d0; --heart:#e8788f;
  --panel:rgba(28,19,16,0.92);
  --panel-line:rgba(232,182,97,0.22);
  --good:#7fc08a; --warn:#e0a95c; --bad:#d9736e;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  background:#191110; color:var(--ink); overflow:hidden;
  display:flex; flex-direction:column;
  height:100dvh;                      /* keeps the bar clear of mobile browser chrome */
  user-select:none; -webkit-user-select:none;
  overscroll-behavior:none; touch-action:manipulation;
}

/* ---------- top bar ---------- */
#topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:14px;
  padding:9px 16px; background:linear-gradient(180deg,#2a1d19,#201512);
  border-bottom:1px solid var(--panel-line); z-index:60; flex-wrap:wrap;
}
.brand{font-size:1.02rem; font-weight:600; letter-spacing:.4px; color:var(--accent); white-space:nowrap}
.brand small{display:block; font-size:.62rem; letter-spacing:2.2px; color:var(--ink-soft); font-weight:400; text-transform:uppercase}
.tb-chip{
  display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:20px;
  background:rgba(232,182,97,0.07); border:1px solid rgba(232,182,97,0.18);
  font-size:.82rem; color:var(--ink-dim); white-space:nowrap;
}
.tb-chip b{color:var(--ink); font-weight:600}
#heartsChip b{color:var(--heart)}
#clockChip b{font-variant-numeric:tabular-nums}
.spacer{flex:1 1 auto}
.tb-btn{
  padding:7px 13px; border-radius:20px; cursor:pointer; white-space:nowrap;
  background:rgba(232,182,97,0.10); border:1px solid rgba(232,182,97,0.26);
  color:var(--accent); font-size:.82rem; font-family:inherit;
  transition:background .18s, transform .1s, opacity .18s;
}
.tb-btn:hover{background:rgba(232,182,97,0.22)}
.tb-btn:active{transform:translateY(1px)}
.tb-btn:disabled{opacity:.35; cursor:default}
.tb-btn.hot{
  background:rgba(232,120,143,0.16); border-color:rgba(232,120,143,0.42); color:#f0a4b3;
  animation:hotPulse 1.6s ease-in-out infinite;
}
@keyframes hotPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,120,143,0)}50%{box-shadow:0 0 0 6px rgba(232,120,143,0.10)}}

/* ---------- café scene: one or more 2.5-D rooms side by side ---------- */
#cafe{
  position:relative; flex:1 1 auto; overflow:hidden; cursor:default; z-index:0; isolation:isolate;
  background:#1a1210;
}
.room{position:absolute; top:0; bottom:0; overflow:hidden}
.plane{position:absolute; inset:0; pointer-events:none}
.r-ceiling{z-index:1; clip-path:polygon(0 0, 15% 4%, 85% 4%, 100% 0); background:linear-gradient(180deg,#1e1512,#33241d)}
.r-wallback{
  position:absolute; left:15%; right:15%; top:4%; height:54%; z-index:2;
  background:linear-gradient(180deg,#453027 0%, #543a2f 52%, #3f2b23 100%);
  box-shadow:inset 0 0 90px rgba(0,0,0,.45);
}
.r-wallback:after{
  content:""; position:absolute; inset:0;
  background:radial-gradient(120% 85% at 50% -6%, rgba(255,206,140,.16), transparent 62%);
}
.r-wallL{z-index:2; clip-path:polygon(0 0, 15% 4%, 15% 58%, 0 100%); background:linear-gradient(90deg,#201613 0%,#3c2921 62%,#4a342b 100%)}
.r-wallR{z-index:2; clip-path:polygon(100% 0, 85% 4%, 85% 58%, 100% 100%); background:linear-gradient(270deg,#201613 0%,#3c2921 62%,#4a342b 100%)}
.r-wallL:after,.r-wallR:after{content:""; position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.35),transparent 45%)}
/* the face of the partition shared with the room next door catches the light */
.room.nbr-right .r-wallR{background:linear-gradient(270deg,#6b4c3d 0%,#5a3f32 40%,#48332a 100%)}
.room.nbr-left  .r-wallL{background:linear-gradient(90deg,#6b4c3d 0%,#5a3f32 40%,#48332a 100%)}
.room.nbr-right .r-wallR:after,.room.nbr-left .r-wallL:after{
  background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 40%);
}
.r-skirt{
  position:absolute; left:15%; right:15%; top:calc(58% - 15px); height:15px; z-index:3;
  background:linear-gradient(180deg,#7a5540,#432c21); box-shadow:0 4px 10px rgba(0,0,0,.5);
}
.seam{position:absolute; width:2px; top:4%; height:54%; z-index:3; background:linear-gradient(180deg,rgba(0,0,0,.5),rgba(0,0,0,.12))}
.r-floor{
  z-index:3; clip-path:polygon(15% 58%, 85% 58%, 100% 100%, 0 100%);
  background:
    repeating-conic-gradient(from 178deg at 50% -52%,
      rgba(0,0,0,.22) 0deg .5deg, rgba(255,255,255,.028) .5deg 1.1deg, transparent 1.1deg 2.9deg),
    linear-gradient(180deg,#4d321f 0%, #6d4728 26%, #86583a 66%, #8e5f3d 100%);
}
.r-shade{
  z-index:4; clip-path:polygon(15% 58%, 85% 58%, 100% 100%, 0 100%);
  background:
    linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.16) 14%, transparent 34%),
    radial-gradient(70% 46% at 50% 12%, rgba(255,214,150,.10), transparent 70%);
}
#nightVeil{
  position:absolute; inset:0; pointer-events:none; z-index:180;
  background:linear-gradient(180deg,rgba(22,30,58,0.52),rgba(16,22,44,0.34));
  opacity:0; transition:opacity 3s linear;
}
/* the café's own lighting, painted over the night veil */
#indoorLight{
  position:absolute; inset:0; pointer-events:none; z-index:181;
  opacity:0; transition:opacity 2.6s linear; mix-blend-mode:screen;
}
.r-rug{
  position:absolute; left:52%; bottom:5%; width:40%; height:17%; z-index:5;
  transform:translateX(-50%); border-radius:50%;
  background:radial-gradient(ellipse at center, #b2705f 0%, #96594c 52%, #6d3d35 100%);
  box-shadow:inset 0 0 0 9px rgba(255,255,255,.07), inset 0 0 0 18px rgba(0,0,0,.12);
  opacity:.85;
}
.r-rug.alt{background:radial-gradient(ellipse at center, #6f8a92 0%, #55707a 52%, #3c525c 100%); left:46%}
/* window in the back wall */
.r-window{
  position:absolute; left:18%; top:11%; width:19%; height:26%; z-index:3;
  border-radius:6px; overflow:hidden; border:8px solid #6b4830;
  box-shadow:0 10px 26px rgba(0,0,0,.5), inset 0 0 26px rgba(0,0,0,.3);
  background:linear-gradient(180deg,#8fc6e0,#cfe6ef); transition:background 3s linear;
}
.r-window.round{border-radius:50%; left:20%; width:16%; height:22%}
.r-window.night{background:linear-gradient(180deg,#121f3d,#1d3055)}
.r-sun{position:absolute; left:58%; top:16%; width:30px; height:30px; border-radius:50%;
  background:radial-gradient(circle,#fff3c4,#f6c65a); box-shadow:0 0 32px 12px rgba(246,198,90,.5); transition:opacity 2s, top 2s}
.r-moon{position:absolute; left:24%; top:18%; width:22px; height:22px; border-radius:50%;
  background:#e8eaf4; box-shadow:0 0 18px 6px rgba(220,230,255,.35), inset -7px 2px 0 0 #1d3055; opacity:0; transition:opacity 2s}
.winbar{position:absolute; background:#6b4830; z-index:3}
.winbar.v{left:calc(50% - 3px); top:0; bottom:0; width:6px}
.winbar.h{top:calc(50% - 3px); left:0; right:0; height:6px}
.r-sill{
  position:absolute; left:calc(18% - 14px); top:calc(11% + 26%); width:calc(19% + 28px);
  height:13px; z-index:4; background:linear-gradient(180deg,#a5744d,#5c3d28); border-radius:2px;
  box-shadow:0 7px 14px rgba(0,0,0,.5);
}
.r-sill:before{
  content:""; position:absolute; left:9px; right:9px; top:-6px; height:6px; background:#c08a55;
  clip-path:polygon(9px 0, calc(100% - 9px) 0, 100% 100%, 0 100%);
}
/* wall shelves */
.shelf{
  position:absolute; height:11px; z-index:4; border-radius:2px;
  background:linear-gradient(180deg,#8a5c3c,#553824); box-shadow:0 8px 16px rgba(0,0,0,.5);
}
.shelf:before{
  content:""; position:absolute; left:8px; right:8px; top:-6px; height:6px; background:#b8834f;
  clip-path:polygon(8px 0, calc(100% - 8px) 0, 100% 100%, 0 100%);
}
.shelf-item{position:absolute; bottom:10px; font-size:18px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.shelfbed{
  position:absolute; z-index:4; width:76px; height:26px; border-radius:5px;
  background:linear-gradient(180deg,#9a6b47,#6d472e); box-shadow:0 6px 12px rgba(0,0,0,.45);
}
.shelfbed:before{
  content:""; position:absolute; left:5px; right:5px; top:4px; height:12px; border-radius:40%;
  background:radial-gradient(ellipse at 50% 30%, #8fa0c4, #5d6c94);
}
.r-board{
  position:absolute; right:19%; top:10%; width:13%; min-width:110px; padding:11px 8px; z-index:4;
  border-radius:4px; border:6px solid #6b4830; background:linear-gradient(180deg,#2c4a44,#20393a);
  box-shadow:0 10px 22px rgba(0,0,0,.5);
  color:#bfe0d4; font-size:.54rem; letter-spacing:1.5px; text-align:center; line-height:2;
}
.r-board b{display:block; font-size:.64rem; letter-spacing:2.4px; color:#e9dcc0; margin-bottom:5px}
.frame{
  position:absolute; z-index:4; border:6px solid #6b4830; border-radius:3px;
  background:linear-gradient(180deg,#3d5566,#2d4150); box-shadow:0 8px 16px rgba(0,0,0,.45);
  display:flex; align-items:center; justify-content:center; font-size:30px; overflow:hidden;
}
.poster{
  position:absolute; z-index:4; border-radius:2px;
  box-shadow:0 8px 18px rgba(0,0,0,.45); transform:rotate(-1.2deg); background:#efe4cf;
}
.poster .pin{
  position:absolute; left:50%; top:-5px; width:9px; height:9px; margin-left:-4.5px;
  border-radius:50%; background:radial-gradient(circle at 35% 30%, #ffd6a0, #b8703a);
  box-shadow:0 2px 4px rgba(0,0,0,.5);
}
.lamp{position:absolute; top:2%; z-index:5; display:flex; flex-direction:column; align-items:center; pointer-events:none}
.lamp i{display:block; width:2px; height:52px; background:#33241d}
.lamp b{
  display:block; width:50px; height:25px; border-radius:0 0 30px 30px;
  background:linear-gradient(180deg,#c98d4e,#8c5a2e); box-shadow:0 8px 26px rgba(255,190,110,.3);
  transition:background 2.6s linear, box-shadow 2.6s linear;
}
.lamp:after{
  content:""; position:absolute; top:66px; width:170px; height:230px; border-radius:50%;
  background:radial-gradient(ellipse at top, rgba(255,203,130,.15), transparent 70%);
  opacity:.6; transition:opacity 2.6s linear, transform 2.6s linear;
}
/* lights on */
#cafe.lights-on .lamp b{
  background:linear-gradient(180deg,#ffdca8,#e0a253);
  box-shadow:0 10px 44px rgba(255,196,110,.75), 0 0 18px rgba(255,214,150,.6);
}
#cafe.lights-on .lamp:after{opacity:1; transform:scale(1.18)}
#cafe.lights-on .r-board,#cafe.lights-on .r-counter .ctop{filter:brightness(1.12)}
/* counter */
.r-counter{position:absolute; width:24%; min-width:170px; height:78px}
.r-counter .cface{
  position:absolute; inset:0; border-radius:2px;
  background:linear-gradient(180deg,#7d5334 0%,#5d3d27 60%,#4b3020 100%);
  box-shadow:0 16px 28px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.2);
}
.r-counter .cface:after{content:""; position:absolute; left:7%; right:7%; top:26px; height:2px; background:rgba(0,0,0,.24)}
.r-counter .ctop{
  position:absolute; left:-24px; right:-24px; top:-24px; height:28px;
  background:linear-gradient(180deg,#c48d57,#94623b);
  clip-path:polygon(24px 0, calc(100% - 24px) 0, 100% 100%, 0 100%);
}
.ctop-item{position:absolute; top:-52px; font-size:24px; filter:drop-shadow(0 5px 5px rgba(0,0,0,.55))}
/* cat tower */
.r-tower{position:absolute; width:126px; height:230px}
.tw-post{position:absolute; bottom:0; background:linear-gradient(90deg,#d9c19c,#a88f6b); border-radius:3px}
.tw-plat{
  position:absolute; height:17px; background:linear-gradient(180deg,#b8834f,#6d472e);
  clip-path:polygon(12px 0, calc(100% - 12px) 0, 100% 100%, 0 100%);
  box-shadow:0 8px 14px rgba(0,0,0,.5);
}
.tw-base{
  position:absolute; left:-8px; bottom:-10px; width:142px; height:20px;
  background:linear-gradient(180deg,#b8834f,#6d472e);
  clip-path:polygon(16px 0, calc(100% - 16px) 0, 100% 100%, 0 100%);
}
.r-tower2{position:absolute; width:110px; height:300px}
.r-tower2 .tw-base{width:124px; left:-7px}
.tw-plat.top{height:19px}
.tw-cushion{
  position:absolute; left:8px; right:8px; top:-11px; height:15px; border-radius:50%;
  background:radial-gradient(ellipse at 45% 30%, #8fa0c4, #5d6c94 70%, #46527a);
  box-shadow:0 3px 6px rgba(0,0,0,.4);
}
.tw-rope{
  position:absolute; left:96px; bottom:150px; width:4px; height:56px; border-radius:2px;
  background:linear-gradient(180deg,#c9b18d,#a88f6b);
}
.tw-rope:after{
  content:""; position:absolute; left:-7px; bottom:-16px; width:18px; height:18px; border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffd9a0,#e07a4a 62%,#a84b26);
  box-shadow:0 3px 5px rgba(0,0,0,.45);
}
/* the dining area */
.r-diner{
  position:absolute;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 10px, transparent 10px 38px),
    linear-gradient(180deg,#4a4238,#5c5042);
  box-shadow:inset 0 0 0 3px rgba(255,225,180,.09);
  opacity:.82;
}
.diner-tag{
  position:absolute; left:50%; top:5px; transform:translateX(-50%);
  font-size:.52rem; letter-spacing:2.6px; color:rgba(255,232,196,.30); white-space:nowrap;
}
/* scratching post */
.r-post{position:absolute; width:26px; height:82px; border-radius:4px; background:linear-gradient(90deg,#d9c19c,#a88f6b); box-shadow:0 10px 14px rgba(0,0,0,.45)}
.r-post:after{
  content:""; position:absolute; left:-15px; bottom:-9px; width:56px; height:15px;
  background:linear-gradient(180deg,#b8834f,#6d472e); clip-path:polygon(8px 0, calc(100% - 8px) 0, 100% 100%, 0 100%);
}
.r-plant{position:absolute; font-size:58px; filter:drop-shadow(0 10px 10px rgba(0,0,0,.55))}
/* the good armchair, brought through from the living room */
.armchair{position:absolute; width:224px; height:198px}
.ac-back{
  position:absolute; left:12%; right:12%; top:0; height:62%;
  border-radius:26px 26px 8px 8px;
  background:linear-gradient(180deg,#8a5566,#6d3f4e);
  box-shadow:inset 0 5px 0 rgba(255,255,255,.10), 0 8px 16px rgba(0,0,0,.4);
}
.ac-back:after{
  content:""; position:absolute; left:24%; right:24%; top:26%; height:34%;
  background:
    radial-gradient(circle at 50% 20%, rgba(0,0,0,.16) 0 8%, transparent 9%),
    radial-gradient(circle at 20% 62%, rgba(0,0,0,.16) 0 8%, transparent 9%),
    radial-gradient(circle at 80% 62%, rgba(0,0,0,.16) 0 8%, transparent 9%);
}
.ac-armL,.ac-armR{
  position:absolute; bottom:16%; width:20%; height:44%; border-radius:16px 16px 6px 6px;
  background:linear-gradient(180deg,#9a6172,#79485a); box-shadow:0 6px 12px rgba(0,0,0,.4);
}
.ac-armL{left:0} .ac-armR{right:0}
.ac-seat{
  position:absolute; left:6%; right:6%; bottom:14%; height:30%; border-radius:14px/50%;
  background:linear-gradient(180deg,#b0788a,#8a5566);
  box-shadow:inset 0 4px 6px rgba(255,255,255,.14), 0 6px 12px rgba(0,0,0,.35);
}
.ac-foot{
  position:absolute; bottom:2%; width:12%; height:12%; border-radius:3px;
  background:linear-gradient(180deg,#6d472e,#4a3226);
}
.ac-foot.l{left:14%} .ac-foot.r{right:14%}
.ac-cushion{
  position:absolute; left:20%; right:20%; bottom:36%; height:16%; border-radius:50%;
  background:radial-gradient(ellipse at 45% 30%, #e3d3b6, #c2ab8b);
  box-shadow:0 3px 6px rgba(0,0,0,.3);
}
/* a little drinking fountain */
.fountain{position:absolute; width:58px; height:50px; pointer-events:none}
.fo-base{
  position:absolute; left:0; right:0; bottom:0; height:46%; border-radius:50%;
  background:linear-gradient(180deg,#dfe8ee,#9fb2bd);
  box-shadow:0 4px 7px rgba(0,0,0,.42), inset 0 -3px 5px rgba(0,0,0,.14);
}
.fo-water{
  position:absolute; left:14%; right:14%; bottom:20%; height:20%; border-radius:50%;
  background:linear-gradient(180deg,#a9dcef,#5fa9c6); opacity:.95;
  animation:foRipple 2.6s ease-in-out infinite;
}
@keyframes foRipple{0%,100%{transform:scale(1)} 50%{transform:scale(1.06,.92)}}
.fo-post{
  position:absolute; left:42%; width:16%; bottom:34%; height:30%;
  background:linear-gradient(90deg,#cfdae2,#93a6b1); border-radius:2px;
}
.fo-top{
  position:absolute; left:20%; right:20%; bottom:58%; height:22%; border-radius:50%;
  background:linear-gradient(180deg,#eef4f8,#b3c4ce); box-shadow:0 3px 5px rgba(0,0,0,.35);
}
.fo-jet{
  position:absolute; left:47%; width:6%; bottom:62%; height:20%; border-radius:3px;
  background:linear-gradient(180deg,rgba(190,235,250,.95),rgba(140,205,230,.25));
  animation:foJet 1.1s ease-in-out infinite;
}
@keyframes foJet{0%,100%{transform:scaleY(1); opacity:.9} 50%{transform:scaleY(1.35); opacity:.65}}
.fo-drop{
  position:absolute; width:4px; height:4px; border-radius:50%; background:rgba(200,240,252,.85);
  animation:foDrop 1.5s linear infinite;
}
@keyframes foDrop{0%{transform:translate(0,0); opacity:0} 20%{opacity:.9} 100%{transform:translate(6px,16px); opacity:0}}

/* a litter tray the cats hop into */
.litter,.litter-front{position:absolute; width:152px; height:82px; pointer-events:none}
.lb-back{
  position:absolute; left:0; right:0; top:0; height:66%;
  background:linear-gradient(180deg,#7f8794,#5f6773);
  border-radius:12px 12px 4px 4px;
}
.lb-sand{
  position:absolute; left:6%; right:6%; top:26%; height:52%; border-radius:50%;
  background:
    radial-gradient(circle at 24% 40%, rgba(0,0,0,.10) 0 10%, transparent 11%),
    radial-gradient(circle at 62% 56%, rgba(0,0,0,.09) 0 9%, transparent 10%),
    radial-gradient(circle at 44% 28%, rgba(255,255,255,.30) 0 8%, transparent 9%),
    linear-gradient(180deg,#e2d6bd,#c6b795);
}
.lb-front{
  position:absolute; left:0; right:0; bottom:0; height:44%;
  background:linear-gradient(180deg,#98a1ae,#6b7481);
  border-radius:0 0 16px 16px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.16), 0 5px 10px rgba(0,0,0,.4);
}
.cat.inbox .cat-leg{opacity:0}
.cat.inbox .cat-inner{animation:boxSettle 3.2s ease-in-out infinite}
@keyframes boxSettle{0%,100%{transform:translateY(3px)} 50%{transform:translateY(4.5px)}}
.cat.digging .cat-leg-fl{animation:digA .28s ease-in-out infinite}
.cat.digging .cat-leg-fr{animation:digB .28s ease-in-out infinite}
@keyframes digA{0%,100%{transform:rotate(-30deg)} 50%{transform:rotate(6deg)}}
@keyframes digB{0%,100%{transform:rotate(4deg)} 50%{transform:rotate(-28deg)}}

/* a mural painted on the right-hand wall */
.mural-wrap{
  position:absolute; inset:0; z-index:3; pointer-events:none;
  clip-path:polygon(100% 0, 85% 4%, 85% 58%, 100% 100%);
}
.mural{
  position:absolute; right:-1%; top:2%; width:27%; height:68%;
  transform-origin:100% 50%;
  transform:perspective(900px) rotateY(-50deg);
  opacity:.82; mix-blend-mode:soft-light;
}
.mural svg{width:100%; height:100%; display:block}
.jelly-bell{transform-box:fill-box; transform-origin:50% 30%; animation:jellyPulse 7.5s ease-in-out infinite}
@keyframes jellyPulse{0%,100%{transform:scale(1,1)} 50%{transform:scale(1.04,.95)}}
.jelly-t{transform-box:fill-box; transform-origin:50% 0%; animation:jellySway 8s ease-in-out infinite}
.jelly-t:nth-of-type(2n){animation-duration:9.6s; animation-delay:-2.2s}
.jelly-t:nth-of-type(3n){animation-duration:11s;  animation-delay:-4.4s}
@keyframes jellySway{0%,100%{transform:rotate(-3.5deg)} 50%{transform:rotate(4deg)}}

/* the doorway between two rooms */
#doorBack{
  position:absolute; z-index:5; overflow:hidden;
  background:
    radial-gradient(70% 50% at 50% 108%, rgba(255,196,120,.22), transparent 70%),
    linear-gradient(180deg,#241a16 0%,#3a2a22 52%,#5a4130 100%);
  box-shadow:inset 0 0 46px rgba(0,0,0,.6);
}
#doorBack:after{                       /* the skirting of the room beyond */
  content:""; position:absolute; left:0; right:0; bottom:0; height:11px;
  background:linear-gradient(180deg,#7a5540,#432c21);
}
#doorSill{
  position:absolute; z-index:7; height:9px; border-radius:2px;
  background:linear-gradient(180deg,#a5744d,#5c3d28); box-shadow:0 4px 10px rgba(0,0,0,.5);
}
#doorFloor{
  position:absolute; z-index:6;
  background:
    repeating-conic-gradient(from 178deg at 50% -52%,
      rgba(0,0,0,.22) 0deg .5deg, rgba(255,255,255,.028) .5deg 1.1deg, transparent 1.1deg 2.9deg),
    linear-gradient(180deg,#5b3d28 0%, #7c5335 40%, #8e5f3d 100%);
  box-shadow:inset 0 14px 26px rgba(0,0,0,.5);
}
#doorArch{
  position:absolute; z-index:7; pointer-events:none;
  border:0 solid transparent;
}
#doorArch .jamb{
  position:absolute; top:0; bottom:0; width:19px;
  background:linear-gradient(90deg,#8a6046,#5c3f2e); box-shadow:0 0 20px rgba(0,0,0,.55);
}
#doorArch .lintel{
  position:absolute; left:-6px; right:-6px; top:0; height:24px;
  background:linear-gradient(180deg,#9a6b4c,#6a4834);
  border-radius:3px; box-shadow:0 10px 20px rgba(0,0,0,.55);
}
#doorArch .glow{
  position:absolute; left:10%; right:10%; top:20px; bottom:0;
  background:radial-gradient(ellipse at 50% 100%, rgba(255,205,140,.30), transparent 74%);
}
#doorSign{
  position:absolute; z-index:8; font-size:.54rem; letter-spacing:2px; white-space:nowrap;
  color:rgba(255,232,196,.5); text-align:center; pointer-events:none;
}
/* ---- the fish tank that runs along the left wall ---- */
.walltank{position:absolute; pointer-events:none}
.walltank svg{position:absolute; inset:0; overflow:visible}
.wt-inner{position:absolute; inset:0}
.wt-weed{transform-box:fill-box; transform-origin:bottom center; animation:weedSway 5.4s ease-in-out infinite}
.wt-weed:nth-of-type(2n){animation-duration:6.9s; animation-delay:-1.7s}
.wt-weed:nth-of-type(3n){animation-duration:7.8s; animation-delay:-3.2s}
@keyframes weedSway{0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(6deg)}}
.wt-fish{
  position:absolute; border-radius:56% 40% 45% 55%;
  box-shadow:inset -2px -1px 2px rgba(0,0,0,.25);
}
.wt-fish:after{
  content:""; position:absolute; right:-52%; top:12%; width:56%; height:76%;
  background:inherit; opacity:.92;
  clip-path:polygon(100% 0, 100% 100%, 0 50%);
}
.wt-bubble{
  position:absolute; border-radius:50%; background:rgba(226,248,255,.6);
  box-shadow:inset -1px -1px 1px rgba(255,255,255,.6);
}
/* baskets & cushions & grass are built in JS so they can be depth-sorted */
.grass{position:absolute; pointer-events:none; transform-origin:bottom center}
.grass .blade{transform-box:fill-box; transform-origin:bottom center; animation:grassSway 5.5s ease-in-out infinite}
.grass .blade:nth-child(2n){animation-duration:6.8s; animation-delay:-1.6s}
.grass .blade:nth-child(3n){animation-duration:7.6s; animation-delay:-3.1s}
@keyframes grassSway{0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(3deg)}}
.bk-back{position:absolute; border-radius:50%; background:linear-gradient(180deg,#c08f56,#8a6238); box-shadow:0 10px 16px rgba(0,0,0,.45)}
.bk-in{position:absolute; border-radius:50%; background:radial-gradient(ellipse at 50% 34%, #8493bd, #4f5c85 70%, #3b4668)}
.bk-front{
  position:absolute; background:linear-gradient(180deg,#cfa066,#9a6d3f);
  border-radius:0 0 999px 999px; box-shadow:inset 0 3px 0 rgba(255,255,255,.14);
}
.bk-cush{position:absolute; border-radius:50%; background:radial-gradient(ellipse at 45% 34%, #c99a72, #a3714f 60%, #784d33); box-shadow:0 8px 12px rgba(0,0,0,.4), inset 0 0 0 5px rgba(255,255,255,.07)}

/* ---------- bowls ---------- */
.bowl{position:absolute; z-index:12; pointer-events:none}
.bowl-dish{
  position:absolute; left:3%; right:3%; bottom:0; height:76%;
  border-radius:0 0 50% 50% / 0 0 100% 100%;
  background:linear-gradient(180deg,#cddae2 0%,#a8bac5 55%,#7f939f 100%);
  box-shadow:0 4px 7px rgba(0,0,0,.45), inset 0 -3px 5px rgba(0,0,0,.15);
}
.bowl-rim{
  position:absolute; left:0; right:0; bottom:60%; height:32%;
  border-radius:50%;
  background:linear-gradient(180deg,#f2f7fa,#b4c4cd);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.2);
}
.bowl-hole{                                    /* the inside of an empty bowl */
  position:absolute; left:9%; right:9%; bottom:64%; height:22%;
  border-radius:50%; background:linear-gradient(180deg,#8b9ea9,#b6c6ce);
}
.bowl-food{
  position:absolute; left:8%; right:8%; bottom:63%; height:26%;
  border-radius:50%;
  background:linear-gradient(180deg,#e0a15c,#a86a30);
  box-shadow:inset 0 2px 3px rgba(255,255,255,.28), 0 1px 2px rgba(0,0,0,.35);
  transform-origin:50% 100%; transform:scale(.25); opacity:0;
  transition:transform .38s cubic-bezier(.25,1.5,.45,1), opacity .22s;
}
.bowl.full .bowl-food{opacity:1; transform:scale(1)}
.bowl-treat .bowl-food, .food-treat .bowl-food{background:linear-gradient(180deg,#f6bccb,#cf5f79)}
.food-wet .bowl-food{background:linear-gradient(180deg,#e09a6b,#9c4f30)}
.food-dry .bowl-food{
  background:
    radial-gradient(circle at 30% 35%, rgba(255,255,255,.35) 0 12%, transparent 13%),
    radial-gradient(circle at 62% 55%, rgba(255,255,255,.28) 0 10%, transparent 11%),
    radial-gradient(circle at 46% 22%, rgba(0,0,0,.18) 0 9%, transparent 10%),
    linear-gradient(180deg,#d5a34a 0%,#8a6122 100%);
}
.bowl.called .bowl-dish{
  box-shadow:0 0 0 3px rgba(232,182,97,.6), 0 5px 10px rgba(0,0,0,.45);
}
.bowl.called{animation:bowlCall 1.05s ease-in-out infinite}
@keyframes bowlCall{0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)}}

/* ---------- cats ---------- */
.cat{
  position:absolute; left:0; top:0; z-index:20;
  transform-origin:bottom center; cursor:pointer;
  transition:filter .2s;
}
.cat .cat-inner{position:relative; transition:transform .35s ease-out}

.cat:hover{filter:drop-shadow(0 0 8px rgba(232,182,97,.55))}
.cat.selected{filter:drop-shadow(0 0 12px rgba(232,182,97,.9))}
.cat svg{display:block; overflow:visible}
.cat-tag{
  position:absolute; left:50%; top:-15px; transform:translateX(-50%) scaleX(var(--flip,1));
  font-size:.58rem; letter-spacing:.4px; color:rgba(240,226,212,.85); white-space:nowrap;
  background:rgba(18,12,10,.55); border:1px solid rgba(232,182,97,.16);
  padding:1px 7px; border-radius:9px; opacity:.66; transition:opacity .18s, background .18s; pointer-events:none;
}
.cat:hover .cat-tag, .cat.show-tag .cat-tag{opacity:1; background:rgba(20,13,11,.92); border-color:rgba(232,182,97,.5)}

/* tail / head / eye idle animations (from fighting-octopus.com) */
.cat-tail{transform-box:fill-box; transform-origin:left bottom; animation:catTailWave 12s ease-in-out infinite}
@keyframes catTailWave{
  0%,58%,100%{transform:rotate(0)} 62%{transform:rotate(22deg)} 66%{transform:rotate(-16deg)}
  70%{transform:rotate(20deg)} 74%{transform:rotate(-12deg)} 78%{transform:rotate(8deg)} 82%{transform:rotate(0)}
}
.cat-head{transform-box:fill-box; transform-origin:right center; animation:catHeadNod 22s ease-in-out infinite}
@keyframes catHeadNod{
  0%,55%,100%{transform:rotate(0)} 60%{transform:rotate(-7deg)} 65%{transform:rotate(5deg)}
  68%{transform:rotate(-3deg)} 72%{transform:rotate(0)}
}
.cat-eye-blink{animation:catEyeBlinkAwake 6s ease-in-out infinite}
@keyframes catEyeBlinkAwake{0%,78%,100%{opacity:1} 82%{opacity:0} 86%{opacity:1}}
.eyes-closed{display:none}
.cat.asleep .eyes-open{display:none}
.cat.asleep .eyes-closed{display:block}
.cat.asleep .cat-leg{opacity:0}
.cat.asleep .cat-inner{animation:catBreathe 4.2s ease-in-out infinite}
.cat.asleep .cat-tail{animation:catTailWave 26s ease-in-out infinite}
@keyframes catBreathe{0%,100%{transform:translateY(5px) scaleY(.97)} 50%{transform:translateY(6px) scaleY(1.005)}}

/* walking legs (from fighting-octopus.com) — cycle speed follows the actual gait */
.cat-leg{transform-box:fill-box; transform-origin:50% 0%}
.cat.walking .cat-leg-fl,.cat.walking .cat-leg-br,
.cat.running .cat-leg-fl,.cat.running .cat-leg-br{animation:legSwingA var(--gait,.5s) ease-in-out infinite}
.cat.walking .cat-leg-fr,.cat.walking .cat-leg-bl,
.cat.running .cat-leg-fr,.cat.running .cat-leg-bl{animation:legSwingB var(--gait,.5s) ease-in-out infinite}
@keyframes legSwingA{0%,100%{transform:rotate(-20deg)} 50%{transform:rotate(24deg)}}
@keyframes legSwingB{0%,100%{transform:rotate(24deg)} 50%{transform:rotate(-20deg)}}
.cat.walking .cat-inner{animation:bodyBob var(--gait,.5s) ease-in-out infinite}
.cat.running .cat-inner{animation:bodyBobRun var(--gait,.3s) ease-in-out infinite}
@keyframes bodyBob{0%,100%{transform:translateY(0)} 25%{transform:translateY(-1.4px)} 50%{transform:translateY(-2.6px)} 75%{transform:translateY(-1.2px)}}
@keyframes bodyBobRun{0%,100%{transform:translateY(.5px)} 50%{transform:translateY(-5px)}}
/* idle cats keep breathing */
.cat.resting .cat-inner{animation:idleBreathe 4.6s ease-in-out infinite}
@keyframes idleBreathe{0%,100%{transform:translateY(0) scaleY(1)} 50%{transform:translateY(.4px) scaleY(1.012)}}
/* mid-air: legs tuck, tail streams out behind */
.cat.crouch .cat-inner{animation:none; transform:translateY(3px) scaleY(.93)}
.cat.airborne .cat-inner{animation:none}
.cat.airborne .cat-leg{animation:none !important}
.cat.airborne .cat-leg-fl,.cat.airborne .cat-leg-fr{transform:rotate(34deg)}
.cat.airborne .cat-leg-bl,.cat.airborne .cat-leg-br{transform:rotate(-30deg)}
.cat.airborne .cat-tail{animation:none; transform:rotate(-20deg)}
.cat.airborne .cat-head{animation:none; transform:rotate(-6deg)}
.cat.petted .cat-inner{animation:pettedPop .55s ease-out}
@keyframes pettedPop{0%{transform:scale(1)} 35%{transform:scale(1.13) translateY(-8px)} 100%{transform:scale(1)}}
/* head down in the bowl, with a slow nom */
.cat.eating .cat-head{animation:headNom .62s ease-in-out infinite}
@keyframes headNom{
  0%,100%{transform:rotate(22deg) translate(-3px,7px)}
  50%    {transform:rotate(31deg) translate(-4px,10.5px)}
}
.cat.eating .cat-inner{animation:eatBody 1.24s ease-in-out infinite}
@keyframes eatBody{0%,100%{transform:translateY(1.5px) scaleY(.985)} 50%{transform:translateY(3px) scaleY(.975)}}
.cat.eating .cat-tail{animation:catTailWave 7s ease-in-out infinite}
/* up on the hind legs, having a good scratch */
.cat.scratching .cat-inner{animation:scratchBody .46s ease-in-out infinite}
@keyframes scratchBody{
  0%,100%{transform:translateY(-5px) rotate(-15deg)}
  50%    {transform:translateY(-9px) rotate(-19deg)}
}
.cat.scratching .cat-leg-fl{animation:scratchPawA .23s ease-in-out infinite}
.cat.scratching .cat-leg-fr{animation:scratchPawB .23s ease-in-out infinite}
.cat.scratching .cat-leg-bl,.cat.scratching .cat-leg-br{animation:none; transform:rotate(4deg)}
@keyframes scratchPawA{0%,100%{transform:rotate(-64deg)} 50%{transform:rotate(-34deg)}}
@keyframes scratchPawB{0%,100%{transform:rotate(-38deg)} 50%{transform:rotate(-68deg)}}
.cat.scratching .cat-tail{animation:catTailWave 5s ease-in-out infinite}

.feed-btn{
  position:absolute; left:86%; top:-4px; width:27px; height:27px; padding:0; border-radius:50%;
  transform:translateX(-50%) scale(var(--inv,1)) scaleX(var(--flip,1));
  background:rgba(22,15,12,.92); border:1.5px solid rgba(232,182,97,.55); color:#f4e6d6;
  font-size:14px; line-height:1; cursor:pointer; pointer-events:auto;
  display:none; align-items:center; justify-content:center;
  box-shadow:0 3px 9px rgba(0,0,0,.55);
}
.cat:hover .feed-btn{display:flex}
.feed-btn:hover{background:rgba(232,182,97,.32); border-color:var(--accent)}
#feedMenu{
  position:absolute; z-index:200; display:none; min-width:206px; padding:8px;
  border-radius:15px; background:rgba(24,16,13,.97); border:1px solid var(--panel-line);
  box-shadow:0 18px 44px rgba(0,0,0,.6);
}
#feedMenu.open{display:block; animation:modalIn .16s ease-out}
.fm-title{font-size:.64rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-soft); padding:4px 9px 8px}
.fm-opt{
  display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; margin-bottom:2px;
  border-radius:11px; cursor:pointer; background:transparent; border:1px solid transparent;
  color:var(--ink); font-family:inherit; font-size:.84rem; text-align:left;
}
.fm-opt:hover:not(:disabled){background:rgba(232,182,97,.15); border-color:rgba(232,182,97,.32)}
.fm-opt:disabled{opacity:.38; cursor:default}
.fm-ic{font-size:19px; width:24px; text-align:center; flex:0 0 auto}
.fm-opt small{display:block; color:var(--ink-soft); font-size:.68rem; margin-top:1px}
.zzz{
  position:absolute; left:14%; top:-6px; font-size:15px; pointer-events:none; transform:scaleX(var(--flip,1));
  animation:zzzFloat 3.4s ease-in-out infinite; opacity:0;
}
.cat.asleep .zzz{opacity:1}
@keyframes zzzFloat{
  0%{transform:scaleX(var(--flip,1)) translate(0,0) scale(.7); opacity:0}
  25%{opacity:.9}
  100%{transform:scaleX(var(--flip,1)) translate(-14px,-30px) scale(1.15); opacity:0}
}

/* ---------- floating emoji / toys ---------- */
.float{
  position:absolute; font-size:24px; pointer-events:none; z-index:170;
  animation:floatUp 1.3s ease-out forwards;
}
@keyframes floatUp{0%{transform:translateY(0) scale(.6); opacity:0} 20%{opacity:1} 100%{transform:translateY(-62px) scale(1.25); opacity:0}}
.toy{position:absolute; z-index:150; pointer-events:none; font-size:26px; filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.ball{width:22px; height:22px; border-radius:50%; background:radial-gradient(circle at 32% 30%,#ffd9a0,#e07a4a 60%,#a84b26); box-shadow:0 3px 6px rgba(0,0,0,.45)}
.critter{position:absolute; z-index:150; pointer-events:none; will-change:transform}
.butterfly{width:36px; height:30px; filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.butterfly svg{display:block; overflow:visible}
.butterfly .wingL{transform-box:fill-box; transform-origin:100% 50%; animation:flapL .24s ease-in-out infinite alternate}
.butterfly .wingR{transform-box:fill-box; transform-origin:0% 50%;   animation:flapR .24s ease-in-out infinite alternate}
@keyframes flapL{from{transform:scaleX(1)} to{transform:scaleX(.34)}}
@keyframes flapR{from{transform:scaleX(1)} to{transform:scaleX(.34)}}
.wildmouse{width:28px; height:16px; filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.wildmouse .body{position:absolute; inset:0; border-radius:58% 42% 50% 50%;
  background:linear-gradient(180deg,#a49a8d,#7d7469)}
.wildmouse .ear{position:absolute; left:2px; top:-3px; width:10px; height:10px; border-radius:50%;
  background:#b0a598; box-shadow:inset -1px -1px 2px rgba(0,0,0,.2)}
.wildmouse .body:after{                                   /* an eye */
  content:""; position:absolute; left:5px; top:6px; width:2.5px; height:2.5px; border-radius:50%; background:#2a241e;
}
.wildmouse .tail{
  position:absolute; right:-13px; top:9px; width:15px; height:2.5px; border-radius:2px; background:#8b8378;
  transform-origin:0 50%; animation:tailWig .45s ease-in-out infinite alternate;
}
@keyframes tailWig{from{transform:rotate(-16deg)} to{transform:rotate(16deg)}}
#laserDot{
  position:absolute; width:14px; height:14px; border-radius:50%; z-index:160; pointer-events:none; display:none;
  background:radial-gradient(circle,#fff,#ff4d4d 55%,rgba(255,60,60,0)); box-shadow:0 0 16px 6px rgba(255,60,60,.55);
}
#cafe.laser-on{cursor:crosshair}

/* ---------- action bar ---------- */
#actions{
  flex:0 0 auto; display:flex; gap:9px; padding:10px 16px; align-items:center; flex-wrap:wrap;
  background:linear-gradient(180deg,#201512,#170e0c); border-top:1px solid var(--panel-line); z-index:60;
}
.act{
  display:flex; align-items:center; gap:7px; padding:9px 15px; border-radius:12px; cursor:pointer;
  background:rgba(255,255,255,0.045); border:1px solid rgba(232,182,97,0.18);
  color:var(--ink-dim); font-size:.84rem; font-family:inherit; transition:all .18s;
}
.act:hover{background:rgba(232,182,97,0.14); color:var(--ink); border-color:rgba(232,182,97,.4)}
.act:active{transform:translateY(1px)}
.act:disabled{opacity:.32; cursor:default; transform:none}
.act.primary{background:rgba(122,180,208,0.14); border-color:rgba(122,180,208,0.36); color:#a8d4e8}
.act.primary:hover{background:rgba(122,180,208,0.26)}
.act.meal{background:rgba(127,192,138,0.14); border-color:rgba(127,192,138,0.38); color:#a6dcae}
.act.meal:hover{background:rgba(127,192,138,0.26)}
.act .cd{font-size:.7rem; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.hint{font-size:.72rem; color:var(--ink-soft); margin-left:auto; text-align:right; line-height:1.5}

/* ---------- toasts ---------- */
#toasts{position:fixed; top:66px; left:50%; transform:translateX(-50%); z-index:400; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none}
.toast{
  padding:9px 18px; border-radius:22px; font-size:.84rem; color:var(--ink);
  background:rgba(28,19,16,.95); border:1px solid var(--panel-line);
  box-shadow:0 10px 30px rgba(0,0,0,.5); animation:toastIn .3s ease-out, toastOut .4s ease-in 3.1s forwards;
}
.toast.reward{border-color:rgba(232,120,143,.5); color:#f3b6c2}
.toast.bad{border-color:rgba(217,115,110,.5); color:#f0b0ad}
@keyframes toastIn{from{opacity:0; transform:translateY(-14px)} to{opacity:1; transform:none}}
@keyframes toastOut{to{opacity:0; transform:translateY(-14px)}}

/* ---------- modals ---------- */
.scrim{
  position:fixed; inset:0; z-index:300; display:none; align-items:center; justify-content:center;
  background:rgba(8,5,4,.72); backdrop-filter:blur(3px); padding:18px;
}
.scrim.open{display:flex}
.modal{
  width:min(560px,100%); max-height:88vh; overflow:auto; border-radius:18px;
  background:var(--panel); border:1px solid var(--panel-line);
  box-shadow:0 26px 70px rgba(0,0,0,.6); animation:modalIn .24s ease-out;
}
.modal.wide{width:min(880px,100%)}
@keyframes modalIn{from{opacity:0; transform:translateY(18px) scale(.97)} to{opacity:1; transform:none}}
.m-head{
  display:flex; align-items:center; gap:12px; padding:16px 20px;
  border-bottom:1px solid rgba(232,182,97,.14);
}
.m-title{font-size:1.05rem; font-weight:600; color:var(--ink)}
.m-sub{font-size:.75rem; color:var(--ink-soft)}
.m-x{
  margin-left:auto; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1rem;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:var(--ink-dim);
}
.m-x:hover{background:rgba(255,255,255,.12); color:var(--ink)}
.m-body{padding:18px 20px}
.m-foot{display:flex; gap:9px; padding:14px 20px 18px; flex-wrap:wrap}

/* cat spec card */
.spec-top{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap}
.spec-portrait{
  flex:0 0 auto; width:190px; height:150px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(ellipse at 50% 80%, rgba(232,182,97,.16), rgba(255,255,255,.02) 70%);
  border:1px solid rgba(232,182,97,.14);
}
.spec-id{flex:1 1 210px; min-width:200px}
.spec-name{display:flex; align-items:center; gap:9px; font-size:1.35rem; font-weight:600; color:var(--ink)}
.gender{font-size:1rem; padding:2px 8px; border-radius:9px}
button.gender{cursor:pointer; border:1px solid transparent; font-family:inherit; transition:border-color .18s}
button.gender:hover{border-color:currentColor}
.gender.f{color:#f3a8c0; background:rgba(243,168,192,.13)}
.gender.m{color:#9fc8ea; background:rgba(159,200,234,.13)}
.spec-meta{margin-top:6px; font-size:.78rem; color:var(--ink-soft); line-height:1.7}
.spec-meta b{color:var(--ink-dim); font-weight:500}
.chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:11px}
.chip{
  display:flex; align-items:center; gap:5px; padding:5px 11px; border-radius:20px; font-size:.74rem;
  background:rgba(232,182,97,.10); border:1px solid rgba(232,182,97,.24); color:var(--accent); cursor:help;
}
.sect{margin-top:20px}
.sect-h{font-size:.66rem; letter-spacing:2px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:10px}
.bar-row{display:flex; align-items:center; gap:11px; margin-bottom:9px; font-size:.78rem}
.bar-lbl{width:96px; color:var(--ink-dim); flex:0 0 auto}
.bar-track{flex:1 1 auto; height:9px; border-radius:6px; background:rgba(255,255,255,.07); overflow:hidden}
.bar-fill{height:100%; border-radius:6px; transition:width .4s, background .4s}
.bar-val{width:40px; text-align:right; color:var(--ink-soft); font-variant-numeric:tabular-nums; flex:0 0 auto}
.traits{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
.trait{font-size:.76rem; color:var(--ink-dim)}
.pips{display:flex; gap:3px; margin-top:5px}
.pip{width:11px; height:5px; border-radius:2px; background:rgba(255,255,255,.1)}
.pip.on{background:var(--accent-2)}

/* roster */
.roster{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:11px}
.rcard{
  padding:11px; border-radius:13px; cursor:pointer; text-align:center;
  background:rgba(255,255,255,.035); border:1px solid rgba(232,182,97,.14); transition:all .18s;
}
.rcard:hover{background:rgba(232,182,97,.10); border-color:rgba(232,182,97,.36); transform:translateY(-2px)}
.rcard .rc-art{height:74px; display:flex; align-items:center; justify-content:center}
.rcard .rc-name{font-size:.84rem; color:var(--ink); margin-top:5px}
.rcard .rc-sub{font-size:.68rem; color:var(--ink-soft); margin-top:2px}
.rc-mini{display:flex; gap:4px; justify-content:center; margin-top:7px}
.rc-mini i{width:15px; height:4px; border-radius:2px; background:rgba(255,255,255,.12); font-style:normal}

/* breeding */
.breed-row{display:flex; gap:14px; align-items:center; justify-content:center; flex-wrap:wrap}
.breed-slot{
  flex:1 1 190px; min-height:186px; border-radius:15px; padding:12px; text-align:center; cursor:pointer;
  background:rgba(255,255,255,.03); border:2px dashed rgba(232,182,97,.26); transition:all .2s;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
}
.breed-slot:hover{border-color:rgba(232,182,97,.6); background:rgba(232,182,97,.07)}
.breed-slot.filled{border-style:solid}
.breed-slot .bs-empty{color:var(--ink-soft); font-size:.8rem}
.breed-heart{font-size:1.8rem; color:var(--heart); flex:0 0 auto}
.picker{display:grid; grid-template-columns:repeat(auto-fill,minmax(126px,1fr)); gap:9px; max-height:320px; overflow:auto; margin-top:6px}
.pcard{padding:8px; border-radius:11px; cursor:pointer; text-align:center; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.08)}
.pcard:hover{border-color:rgba(232,182,97,.5); background:rgba(232,182,97,.09)}
.pcard.dim{opacity:.35; cursor:not-allowed}
.pcard .pc-n{font-size:.75rem; margin-top:4px; color:var(--ink)}
.pcard .pc-s{font-size:.64rem; color:var(--ink-soft)}
.newborn{text-align:center; padding:8px 0}
.newborn .nb-art{animation:nbPop .7s cubic-bezier(.2,1.5,.4,1)}
@keyframes nbPop{0%{transform:scale(.2); opacity:0} 100%{transform:scale(1); opacity:1}}
.field{
  width:100%; padding:11px 14px; border-radius:11px; font-size:.95rem; font-family:inherit;
  background:rgba(255,255,255,.06); border:1px solid rgba(232,182,97,.28); color:var(--ink); outline:none;
}
.field:focus{border-color:var(--accent)}
.note{font-size:.74rem; color:var(--ink-soft); line-height:1.65}

/* wall decor keeps its place but shrinks with the room */
.frame, .poster, .shelfbed{transform:scale(var(--k,1)); transform-origin:top left}
.lamp{transform:scale(var(--k,1)); transform-origin:top center}
.r-counter{min-width:calc(170px * var(--k,1))}
.r-board{min-width:calc(110px * var(--k,1)); font-size:calc(.54rem * var(--k,1)); padding:calc(11px * var(--k,1)) calc(8px * var(--k,1))}
.r-board b{font-size:calc(.64rem * var(--k,1))}
.shelf.sh1{min-width:calc(120px * var(--k,1))}
.shelf.sh2{min-width:calc(96px * var(--k,1))}
.shelf-item{font-size:calc(18px * var(--k,1))}
.ctop-item{font-size:calc(24px * var(--k,1)); top:calc(-52px * var(--k,1))}

/* ---------- small screens ---------- */
@media (max-width:820px), (max-height:560px){
  #topbar{gap:7px; padding:6px 10px; padding-top:calc(6px + env(safe-area-inset-top))}
  .brand{font-size:.92rem}
  .brand small{display:none}
  .tb-chip{padding:5px 9px; font-size:.74rem; gap:5px}
  .tb-btn{padding:6px 10px; font-size:.76rem}
  #popChip{display:none}
  #actions{
    gap:7px; padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
    flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden; scrollbar-width:none;
  }
  #actions::-webkit-scrollbar{display:none}
  .act{padding:9px 12px; font-size:.8rem; flex:0 0 auto}
  .hint{display:none}
  .modal, .modal.wide{width:100%; max-height:90vh; border-radius:16px}
  .m-body{padding:14px}
  .m-foot{padding:12px 14px calc(14px + env(safe-area-inset-bottom))}
  .m-foot .act{flex:1 1 auto; justify-content:center}
  .spec-top{gap:12px}
  .spec-portrait{width:100%; height:132px}
  .roster{grid-template-columns:repeat(auto-fill,minmax(116px,1fr)); gap:8px}
  .picker{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
  .breed-slot{flex:1 1 140px; min-height:150px}
  .cat-tag{font-size:.5rem; padding:1px 5px; top:-12px}
  #feedMenu{min-width:200px}
  .fm-opt{padding:11px 12px}
}
@media (max-width:820px), (max-height:560px){
  .r-board{right:11%; width:21%; min-width:0; font-size:.44rem; line-height:1.75; padding:6px 4px; letter-spacing:.8px}
  .r-board b{font-size:.5rem; letter-spacing:1.4px; margin-bottom:3px}
}
@media (max-width:520px){
  .brand{font-size:.82rem}
  #clockChip span{display:none}
  .tb-chip{padding:5px 8px; font-size:.7rem}
  .tb-btn{padding:6px 9px; font-size:.72rem}
  .act{padding:10px 11px; font-size:.78rem}
  .diner-tag{display:none}
}
/* on a touch screen the little bowl button belongs to the cat you tapped */
body.touch .cat:hover .feed-btn{display:none}
body.touch .cat.selected .feed-btn{display:flex; width:34px; height:34px; font-size:17px}
body.touch .feed-btn{border-color:rgba(232,182,97,.75)}
#cafe.laser-on{touch-action:none}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">🐾 CATopia<small>a quiet cat café</small></div>
  <div class="tb-chip" id="clockChip">🕒 <b id="clockTxt">08:00</b> <span id="dayTxt" style="color:var(--ink-soft)">Day 1</span></div>
  <div class="tb-chip" id="heartsChip">💗 <b id="heartsTxt">0</b></div>

  <div class="tb-chip" id="mealChip">🍽 <b id="mealTxt">—</b></div>
  <div class="spacer"></div>
  <button class="tb-btn" id="rosterBtn">📋 Cats</button>
  <button class="tb-btn" id="breedBtn">💞 Breed</button>
  <button class="tb-btn" id="speedBtn" title="Time speed">⏩ 1×</button>
  <button class="tb-btn" id="helpBtn">?</button>
</div>

<div id="cafe">
  <div id="rooms"></div>
  <div id="doorBack"></div>
  <div id="doorFloor"></div>
  <div id="doorSill"></div>
  <div id="doorArch"><div class="glow"></div><div class="jamb l"></div><div class="jamb r"></div><div class="lintel"></div></div>
  <div id="doorSign">🐾 NEXT DOOR 🐾</div>
  <div id="nightVeil"></div>
  <div id="indoorLight"></div>
  <div id="laserDot"></div>
  <div id="feedMenu"></div>
</div>

<div id="actions">
  <button class="act meal" id="feedBtn">🍽 <span id="feedLbl">Serve Breakfast</span></button>
  <button class="act" id="treatBtn">🐟 Treat <span class="cd" id="treatCd"></span></button>
  <button class="act primary" id="ballBtn">⚽ Ball</button>
  <button class="act primary" id="mouseBtn">🐭 Mouse Toy</button>
  <button class="act primary" id="laserBtn">🔦 Laser Pointer</button>
  <button class="act" id="featherBtn">🪶 Feather Wand</button>
  <div class="hint">Nothing here needs you — the bowls fill themselves and the cats look after themselves.<br>Stay and watch, or join in: click a cat for its card, its 🥣 for a treat, or put out a toy.</div>
</div>

<div id="toasts"></div>
<div id="laserHalo"></div>

<!-- cat spec modal -->
<div class="scrim" id="specScrim"><div class="modal" id="specModal"></div></div>
<!-- roster modal -->
<div class="scrim" id="rosterScrim"><div class="modal wide" id="rosterModal"></div></div>
<!-- breed modal -->
<div class="scrim" id="breedScrim"><div class="modal wide" id="breedModal"></div></div>
<!-- help modal -->
<div class="scrim" id="helpScrim"><div class="modal" id="helpModal"></div></div>

<script>
/* ============================================================
   1. HELPERS
   ============================================================ */
const R = (a,b) => a + Math.random()*(b-a);
const RI = (a,b) => Math.floor(R(a,b+1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const chance = p => Math.random() < p;
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const $ = id => document.getElementById(id);
let UID = 1;

/* ============================================================
   2. COATS  (artwork adapted from fighting-octopus.com cats)
   ============================================================ */
const EYES = ['#5ca85c','#c8a032','#7ab4d0','#c07a3a','#8fbf8f','#6fa8c8','#d4b04a'];

const COATS = [
  {breed:'Bombay',            base:'#0d0d0d', light:'#2b2b2b', ear:'#3a2a2a', eye:'#7ab4d0'},
  {breed:'Tuxedo',            base:'#151515', light:'#333',    belly:'#f4f2ee', ear:'#d4a0a0', eye:'#c8a032'},
  {breed:'Grey & White',      base:'#888888', light:'#a4a4a4', belly:'#f0f0f0', ear:'#d4a0a0', eye:'#c8a032'},
  {breed:'Norwegian Forest',  base:'#363636', light:'#4a4a4a', ear:'#5a4a4a', eye:'#5ca85c', fluff:true},
  {breed:'Ginger Tabby',      base:'#c9743a', light:'#e09055', belly:'#f6e2c6', stripes:'#9c5222', ear:'#e8b0a0', eye:'#5ca85c'},
  {breed:'Silver Tabby',      base:'#a8b0b6', light:'#c2c9ce', belly:'#e9eef0', stripes:'#6c767d', ear:'#d9aeae', eye:'#5ca85c'},
  {breed:'Brown Tabby',       base:'#8a6a49', light:'#a3835f', belly:'#e6d3b4', stripes:'#5c432c', ear:'#d9a8a0', eye:'#c8a032'},
  {breed:'Russian Blue',      base:'#7d8a94', light:'#98a5af', ear:'#c8a3a3', eye:'#5ca85c'},
  {breed:'Calico',            base:'#f2eee6', light:'#ffffff', patch:'#c9743a', patch2:'#33291f', ear:'#e8b6b6', eye:'#c8a032'},
  {breed:'Tortoiseshell',     base:'#3a2b22', light:'#57402f', patch:'#b5702f', ear:'#c99a8a', eye:'#c07a3a'},
  {breed:'Siamese',           base:'#e8dcc6', light:'#f4ecdc', points:'#4a3a30', ear:'#4a3a30', eye:'#6fa8c8'},
  {breed:'Snowshoe',          base:'#f2f0ea', light:'#ffffff', points:'#6d5a4c', belly:'#ffffff', ear:'#e8bcbc', eye:'#7ab4d0'},
  {breed:'Maine Coon',        base:'#6b4f38', light:'#8d6b4c', stripes:'#49331f', ear:'#c9948a', eye:'#c8a032', fluff:true},
  {breed:'Cream Longhair',    base:'#e2c9a0', light:'#f3dfba', ear:'#e6b4ac', eye:'#6fa8c8', fluff:true},
  {breed:'Smoke Longhair',    base:'#4e4e56', light:'#6b6b76', ear:'#b08a8a', eye:'#d4b04a', fluff:true},
  {breed:'Chocolate Point',   base:'#dcc9b0', light:'#ece0cd', points:'#5a3b2c', ear:'#5a3b2c', eye:'#7ab4d0'}
];

/* Build one cat's SVG. c.coat holds the palette; `w` is pixel width. */
function catSVG(c, w, opts){
  opts = opts || {};
  const k = c.coat;
  const body   = k.base;
  const light  = k.light  || k.base;
  const shade  = k.shade  || shadeOf(k.base);
  const belly  = k.belly  || null;
  const legCol = k.points ? k.points : (belly || body);
  const faceCol= k.points ? k.points : body;
  const earOut = k.points ? k.points : body;
  const eye    = k.eye;
  const dark   = '#14100e';
  const s = [];
  const P = (d,st,sw,extra) => s.push('<path d="'+d+'" stroke="'+st+'" stroke-width="'+sw+'" fill="none" stroke-linecap="round"'+(extra||'')+'/>');

  /* --- tail --- */
  if (k.fluff){
    s.push('<g class="cat-tail">');
    P('M51,27 C57,20 59,11 53,7', shade, 14);
    P('M51,27 C57,20 59,11 53,7', light, 9);
    P('M51,27 C57,20 59,11 53,7', body, 5);
    P('M53,7 C52,3 56,1 56,5', light, 2);
    P('M53,7 C57,5 61,8 58,11', light, 2);
    P('M53,7 C55,3 59,5 57,8', light, 1.5);
    s.push('</g>');
  } else {
    s.push('<path class="cat-tail" d="M51,27 C57,20 59,11 53,7" stroke="'+(k.points?k.points:body)+'" stroke-width="5" fill="none" stroke-linecap="round"/>');
    if (k.stripes) s.push('<path class="cat-tail" d="M51,27 C57,20 59,11 53,7" stroke="'+k.stripes+'" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="3 4" opacity=".85"/>');
  }

  /* --- legs --- */
  const legs = [['fl','M22,35 L20,46'],['fr','M27,36 L25,46'],['bl','M38,36 L36,46'],['br','M43,35 L41,46']];
  legs.forEach(l => s.push('<path class="cat-leg cat-leg-'+l[0]+'" d="'+l[1]+'" stroke="'+legCol+'" stroke-width="5" stroke-linecap="round"/>'));

  /* --- long-hair wisps behind the body --- */
  if (k.fluff){
    s.push('<g stroke="'+light+'" stroke-width="2" stroke-linecap="round" fill="none">'+
      '<path d="M17,22 C14,17 16,13 18,17"/><path d="M22,19 C19,14 21,10 23,14"/>'+
      '<path d="M27,18 C24,13 26,9 28,13"/><path d="M32,18 C29,12 31,9 33,13"/>'+
      '<path d="M37,18 C34,13 36,10 39,14"/><path d="M42,20 C39,15 41,12 44,16"/>'+
      '<path d="M47,22 C44,17 46,14 49,18"/><path d="M21,37 C19,41 21,45 22,41"/>'+
      '<path d="M27,38 C25,42 27,46 28,42"/><path d="M33,38 C31,42 33,46 34,42"/>'+
      '<path d="M39,37 C37,41 39,45 40,41"/><path d="M45,36 C43,39 45,43 46,40"/></g>');
  }

  /* --- body --- */
  if (k.fluff) s.push('<ellipse cx="30" cy="28" rx="23" ry="10.5" fill="'+light+'"/>');
  s.push('<ellipse cx="30" cy="28" rx="21" ry="9" fill="'+body+'"/>');
  if (belly) s.push('<ellipse cx="30" cy="31" rx="14" ry="5" fill="'+belly+'"/>');
  if (k.patch){
    s.push('<ellipse cx="24" cy="26" rx="8" ry="6" fill="'+k.patch+'"/>');
    s.push('<ellipse cx="42" cy="29" rx="7" ry="5.5" fill="'+(k.patch2||k.patch)+'"/>');
    s.push('<ellipse cx="34" cy="24" rx="5" ry="3.6" fill="'+(k.patch2||k.patch)+'" opacity=".85"/>');
  }
  if (k.stripes){
    s.push('<g stroke="'+k.stripes+'" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".9">'+
      '<path d="M25,21 L24,27"/><path d="M31,20 L30,27"/><path d="M37,20.5 L36,27"/>'+
      '<path d="M43,22 L42,27.5"/><path d="M47,24 L46,28"/></g>');
  }
  if (k.fluff){
    s.push('<g stroke="'+light+'" stroke-width="1.5" stroke-linecap="round" fill="none" opacity=".8">'+
      '<path d="M29,22 C31,20 34,21 32,23"/><path d="M35,21 C37,19 40,20 38,22"/>'+
      '<path d="M41,22 C43,20 46,21 44,23"/><path d="M29,27 C31,25 34,26 32,28"/>'+
      '<path d="M37,31 C39,29 42,30 40,32"/><path d="M43,30 C45,28 48,29 46,31"/></g>');
    s.push('<path d="M22,28 C19,22 21,16 25,19 C27,16 29,22 27,28" fill="'+light+'" stroke="'+light+'" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>');
  }

  /* --- head --- */
  s.push('<g class="cat-head">');
  if (k.fluff){
    s.push('<circle cx="13" cy="17" r="14.5" fill="'+shade+'"/>');
    s.push('<circle cx="13" cy="17" r="13" fill="'+light+'"/>');
  }
  s.push('<circle cx="13" cy="17" r="11" fill="'+faceCol+'"/>');
  if (k.fluff){
    s.push('<polygon points="3,11 7,0 16,10" fill="'+light+'"/><polygon points="5,10 8,2 14,10" fill="'+earOut+'"/>');
    s.push('<polygon points="10,10 17,0 24,10" fill="'+light+'"/><polygon points="12,10 17,2 22,10" fill="'+earOut+'"/>');
    P('M11,7 C10,4 11,1 13,3 C15,1 16,4 15,7', light, 2.5);
  } else {
    s.push('<polygon points="5,9 9,1 14,9" fill="'+earOut+'"/>');
    s.push('<polygon points="13,8 17,1 21,9" fill="'+earOut+'"/>');
    if (k.ear){
      s.push('<polygon points="7,9 9,4 12,9" fill="'+k.ear+'" opacity="0.65"/>');
      s.push('<polygon points="14,8 17,4 19,8" fill="'+k.ear+'" opacity="0.65"/>');
    }
  }
  if (belly && !k.points) s.push('<ellipse cx="13" cy="22" rx="5" ry="2.8" fill="'+belly+'"/>');
  if (k.points) s.push('<ellipse cx="13" cy="21.5" rx="4.4" ry="2.6" fill="'+k.points+'" opacity=".55"/>');
  if (k.stripes){
    s.push('<g stroke="'+k.stripes+'" stroke-width="1.6" stroke-linecap="round" fill="none" opacity=".9">'+
      '<path d="M9,8 L10,11"/><path d="M13,7 L13,10.5"/><path d="M17,8 L16,11"/></g>');
  }
  /* eyes: open + closed pair, toggled by .asleep */
  s.push('<g class="eyes-open"><g class="cat-eye-blink">'+
    '<circle cx="10" cy="15" r="2.8" fill="'+eye+'"/><ellipse cx="10" cy="15" rx="1.2" ry="2.1" fill="'+dark+'"/>'+
    '<circle cx="16" cy="15" r="2.8" fill="'+eye+'"/><ellipse cx="16" cy="15" rx="1.2" ry="2.1" fill="'+dark+'"/>'+
    '</g></g>');
  s.push('<g class="eyes-closed">'+
    '<path d="M7,15 Q10,19 13,15" stroke="'+eye+'" stroke-width="2" fill="none" stroke-linecap="round"/>'+
    '<path d="M13,15 Q16,19 19,15" stroke="'+eye+'" stroke-width="2" fill="none" stroke-linecap="round"/></g>');
  s.push('<ellipse cx="13" cy="20.5" rx="1.6" ry="1.1" fill="'+eye+'" opacity="0.6"/>');
  s.push('</g>');

  const h = Math.round(w * 48/62);
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 62 48" xmlns="http://www.w3.org/2000/svg">'+s.join('')+'</svg>';
}

function shadeOf(hex){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,((n>>16)&255)-26), g = Math.max(0,((n>>8)&255)-26), b = Math.max(0,(n&255)-26);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ============================================================
   3. PERKS & NAMES
   ============================================================ */
const PERKS = {
  cuddly:   {i:'🤗', n:'Cuddly',        d:'Loves attention — bonds twice as fast when petted.'},
  glutton:  {i:'🍗', n:'Glutton',       d:'Gets hungry fast, but eats every last bite.'},
  picky:    {i:'🙄', n:'Picky Eater',   d:'Nibbles only half a portion at each meal.'},
  lazy:     {i:'😴', n:'Lazy',          d:'Naps often and keeps energy far longer.'},
  acrobat:  {i:'🤸', n:'Acrobat',       d:'Climbs the shelves and the cat tower to nap.'},
  hunter:   {i:'🎯', n:'Hunter',        d:'First to any toy — earns bonus 💗 at playtime.'},
  shy:      {i:'🫣', n:'Shy',           d:'Sticks to the edges of the café, slow to warm up.'},
  chatty:   {i:'💬', n:'Chatty',        d:'Meows for attention all day long.'},
  mischief: {i:'😼', n:'Mischievous',   d:'Knocks things off the shelves purely for sport.'},
  sunbather:{i:'☀️', n:'Sunbather',     d:'Happiest by the window while the sun is up.'},
  nightowl: {i:'🌙', n:'Night Owl',     d:'Wide awake long after the café closes.'},
  gourmet:  {i:'🍤', n:'Gourmet',       d:'Treats give double happiness.'},
  zen:      {i:'🧘', n:'Zen',           d:'Contentment fades very slowly.'},
  speedy:   {i:'⚡', n:'Speedy',        d:'Zooms across the café at top speed.'},
  charmer:  {i:'✨', n:'Charmer',       d:'Cheers up every cat nearby just by existing.'},
  velcro:   {i:'🧲', n:'Velcro Cat',    d:'Follows the other cats absolutely everywhere.'},
  floof:    {i:'🌾', n:'Floofball',     d:'Sheds on everything. Worth it.'},
  brave:    {i:'🛡', n:'Brave',         d:'Never startles, always investigates first.'}
};
const PERK_KEYS = Object.keys(PERKS);

const NAMES_F = ['Mochi','Luna','Nala','Suki','Momo','Cleo','Poppy','Hazel','Yuki','Olive','Freya','Coco','Maple','Peach','Dottie','Edda','Pixel','Biscuit','Juno','Willow','Truffle','Sable','Kiki','Marzipan'];
const NAMES_M = ['Teddy','Oskar','Miso','Pepper','Basil','Tofu','Gizmo','Bandit','Waffle','Loki','Salem','Nori','Pumpkin','Otto','Sushi','Milo','Bear','Pancake','Zorro','Ziggy','Espresso','Mango','Klaus','Noodle'];

function freshName(state, forceG){
  const used = new Set(state.cats.map(c=>c.name));
  const g = forceG || (chance(.5) ? 'F' : 'M');
  const pool = (g==='F'?NAMES_F:NAMES_M).filter(n=>!used.has(n));
  const name = pool.length ? pick(pool) : pick(g==='F'?NAMES_F:NAMES_M)+' '+RI(2,9);
  return {name, gender:g};
}

/* ============================================================
   4. CAT FACTORY
   ============================================================ */
function makeCat(state, opts){
  opts = opts || {};
  const id = 'c'+(UID++);
  const ng = opts.name ? {name:opts.name, gender:opts.gender} : freshName(state, opts.gender);
  const coat = opts.coat || (() => {
    const c = Object.assign({}, pick(COATS));
    c.eye = chance(.75) ? c.eye : pick(EYES);
    return c;
  })();
  const nPerks = opts.perks ? opts.perks.length : (chance(.22) ? 3 : chance(.5) ? 2 : 1);
  let perks = opts.perks;
  if (!perks){
    perks = [];
    const pool = PERK_KEYS.slice();
    for (let i=0;i<nPerks;i++) perks.push(pool.splice(RI(0,pool.length-1),1)[0]);
  }
  const cat = {
    id, name:ng.name, gender:ng.gender, coat, perks,
    born: opts.born !== undefined ? opts.born : (state ? state.t - 1440*RI(3,11) : 0),
    parents: opts.parents || null,
    traits:{
      appetite:  RI(3,10), playful: RI(3,10), agility: RI(3,10), charm: RI(3,10)
    },
    hunger: opts.newborn ? 70 : R(55,88),
    happy:  opts.newborn ? 92 : R(58,86),
    energy: R(52,95),
    bond:   opts.newborn ? 30 : R(8,42),
    meals:  0, pets:0, plays:0, grown:!opts.newborn,
    /* temperament: how restless this cat is, and how briskly it moves */
    temper: clamp(R(0.12,0.95)
              + (perks.indexOf('lazy')>=0    ? -0.32 : 0)
              + (perks.indexOf('zen')>=0     ? -0.18 : 0)
              + (perks.indexOf('shy')>=0     ? -0.12 : 0)
              + (perks.indexOf('speedy')>=0  ?  0.22 : 0)
              + (perks.indexOf('acrobat')>=0 ?  0.16 : 0)
              + (perks.indexOf('mischief')>=0?  0.14 : 0), 0.07, 1),
    pace:   R(0.80, 1.24),
    /* runtime */
    room:0,
    x:0, y:0, dir: chance(.5)?1:-1, state:'idle', tx:0, ty:0, wait:R(1,4),
    spot:null, el:null, mood:'🙂'
  };
  if (perks.includes('glutton'))  cat.traits.appetite = clamp(cat.traits.appetite+3,1,10);
  if (perks.includes('picky'))    cat.traits.appetite = clamp(cat.traits.appetite-3,1,10);
  if (perks.includes('speedy'))   cat.traits.agility  = clamp(cat.traits.agility+3,1,10);
  if (perks.includes('acrobat'))  cat.traits.agility  = clamp(cat.traits.agility+2,1,10);
  if (perks.includes('cuddly'))   cat.traits.charm    = clamp(cat.traits.charm+2,1,10);
  return cat;
}

const has = (c,p) => c.perks.indexOf(p) >= 0;
const ageDays = c => Math.max(0,(G.t - c.born)/1440);
const isKitten = c => ageDays(c) < 2;
const catScaleBase = c => isKitten(c) ? 0.62 : 1;

/* breed two cats into a kitten */
function breedCats(a, b){
  const mum = a.gender==='F' ? a : b, dad = a.gender==='F' ? b : a;
  const base = chance(.5) ? a.coat : b.coat;
  const other = base === a.coat ? b.coat : a.coat;
  const coat = Object.assign({}, base);
  if (other.belly   && chance(.5)) coat.belly   = other.belly;
  if (other.stripes && chance(.45)) coat.stripes = other.stripes;
  if (other.patch   && chance(.4))  { coat.patch = other.patch; coat.patch2 = other.patch2; }
  if (other.points  && chance(.35)) coat.points  = other.points;
  coat.fluff = (a.coat.fluff || b.coat.fluff) ? chance(.65) : chance(.08);
  coat.eye   = chance(.15) ? pick(EYES) : pick([a.coat.eye, b.coat.eye]);
  coat.breed = a.coat.breed === b.coat.breed ? a.coat.breed : (a.coat.breed+' × '+b.coat.breed);
  /* perks: one from each parent + small chance of a brand-new one */
  const set = new Set();
  set.add(pick(a.perks));
  if (chance(.8)) set.add(pick(b.perks));
  if (chance(.3)) set.add(pick(PERK_KEYS));
  const kit = makeCat(G, {coat, perks:[...set], born:G.t, newborn:true, parents:[mum.name, dad.name]});
  /* traits inherit as parent average ±2 */
  ['appetite','playful','agility','charm'].forEach(t=>{
    kit.traits[t] = clamp(Math.round((a.traits[t]+b.traits[t])/2 + RI(-2,2)),1,10);
  });
  return kit;
}

function ensureRooms(n){
  const host = $('rooms');
  while (S.rooms.length < n){
    const i = S.rooms.length;
    const el = document.createElement('div');

    el.dataset.room = i;
    el.innerHTML = roomHTML(i);
    host.appendChild(el);
    S.rooms.push({i, el});

  while (S.rooms.length > n){
    const r = S.rooms.pop();
    r.el.remove();
  }
}

function roomBoundsRaw(y, ri){
  const t = depthT(y);
  const R = ROOMS[clamp(ri===undefined?0:ri, 0, ROOMS.length-1)] || {backL:0, backR:S.W, x0:0, x1:S.W};

  ri = clamp(ri===undefined?0:ri, 0, Math.max(0,ROOMS.length-1));
  const [lo, hi] = roomBounds(y, ri);
  if (ROOMS.length < 2) return [lo, hi];
  const t = depthT(y), R = ROOMS[ri];
  if (t < DOOR_T0 || t > DOOR_T1) return [lo, hi];
  return [ R.i > 0 ? Math.min(lo, R.x0) : lo,
           R.i < ROOMS.length-1 ? Math.max(hi, R.x1) : hi ];
}
function clampFloor(c){
  const ri = roomIx(c);
  const [lo, hi] = floorBounds(c.y, ri);
  const [rlo, rhi] = roomBounds(c.y, ri);
  const m = 60*depthScale(c.y);
  /* no margin on the side that opens into the doorway — cats must reach the threshold */
  const a = lo + (lo < rlo - 0.5 ? 0 : m);
  const b = hi - (hi > rhi + 0.5 ? 0 : m);
  c.y = clamp(c.y, S.backY+4, S.frontY);
  c.x = clamp(c.x, Math.min(a,b), Math.max(a,b));
}
const floorX = (t, fx, ri) => {
  const y = S.backY + t*(S.frontY-S.backY);
  const [a,b] = roomBounds(y, ri);
  return {x:a + fx*(b-a), y};
};
const doorX = () => ROOMS.length > 1 ? ROOMS[0].x1 : S.W/2;
const doorY = () => S.backY + (DOOR_T0+DOOR_T1)/2*(S.frontY - S.backY);

const bowlHTML = () =>
  '<div class="bowl-dish"></div><div class="bowl-hole"></div><div class="bowl-rim"></div><div class="bowl-food"></div>';

function layout(){
  const r = cafe.getBoundingClientRect();
  S.W = r.width; S.H = r.height;
  S.backY  = S.H*ROOM.backY;
  S.frontY = S.H*ROOM.frontY;
  S.floorTop = S.backY; S.floorBot = S.frontY;      /* kept for the toy code */

  const n = clamp(G.roomsOpen||1, 1, MAX_ROOMS);
  ensureRooms(n);
  ROOMS.length = 0;
  for (let i=0;i<n;i++){
    const x0 = S.W*(i/n), x1 = S.W*((i+1)/n), w = x1-x0;
    ROOMS.push({i, x0, x1, backL:x0 + w*ROOM.backL, backR:x0 + w*ROOM.backR});
    const el = S.rooms[i].el;
    el.style.left = x0+'px'; el.style.width = w+'px';
    el.classList.toggle('nbr-right', i < n-1);
    el.classList.toggle('nbr-left',  i > 0);
  }
  const rect = el => { const q = el.getBoundingClientRect(); return {x:q.left-r.left, y:q.top-r.top, w:q.width, h:q.height, b:q.bottom-r.top}; };

  const prevTaken = {};
  (S.spots||[]).forEach(s=>{ if (s.taken) prevTaken[s.key] = s.taken; });
  S.spotTaken = prevTaken;
  S.spots = [];
  ROOMS.forEach(R => layoutRoom(R, rect));
  layoutDoor();
  buildIndoorLight(rect);

  /* re-link cats to the rebuilt spot objects so a resize doesn't strand them */
  G.cats.forEach(c=>{
    if (c.room === undefined || c.room >= ROOMS.length) c.room = 0;
    if (c.spot){
      const ns = S.spots.find(s=>s.key===c.spot.key);
      if (ns){
        ns.taken = c.id; c.spot = ns; c.room = ns.room;
        if (c.state==='sleep' || c.state==='lounge'){ c.x = ns.x; c.y = ns.y; }
        else { c.tx = ns.x; c.ty = ns.groundY; }
      } else {
        c.spot = null; c.spotMode = null;
        if (c.state==='toSpot' || c.state==='lounge'){ c.state='idle'; c.wait=R(.5,2); }
      }
    }
    if (!c.spot) clampFloor(c);
  });
}
window.addEventListener('resize', layout);

function layoutRoom(R, rect){
  const i = R.i, el = S.rooms[i].el, q = s => el.querySelector(s);

  /* free-standing props stand on the perspective floor */
  const k = uiScale();
  el.style.setProperty('--k', k.toFixed(3));
  const put = (elm, t, fx, w, h) => {
    if (!elm) return null;
    const p = floorX(t, fx, i);
    elm.style.left = (p.x - R.x0 - w/2)+'px';
    elm.style.top  = (p.y - h)+'px';
    elm.style.transformOrigin = '50% 100%';
    elm.style.transform = k < 0.999 ? 'scale('+k.toFixed(3)+')' : '';

    return p;
  };
  const counter = q('.r-counter');
  const cw = counter ? (counter.offsetWidth || 180) : 180;
  put(counter, 0.10, 0.30, cw, 78);
  put(q('.r-tower'), 0.30, 0.88, 126, 230);
  put(q('.r-tower2'), 0.11, 0.62, 110, 300);
  put(q('.r-post'),  0.46, 0.34, 26, 82);
  put(q('.r-plant'), 0.16, 0.055, 58, 62);

  /* fountains tucked into two corners, and a litter tray */

  S.litters = S.litters.filter(l=>l.room !== i);
  const f1 = put(q('.fountain.f1'), 0.955, 0.10, 58, 50);
  const f2 = put(q('.fountain.f2'), 0.13,  0.955, 58, 50);
  [f1,f2].forEach(p=>{ if (p) S.founts.push({room:i, x:p.x, y:p.y, scale:depthScale(p.y)}); });
  const lbox = q('.litter'), lfront = q('.litter-front');
